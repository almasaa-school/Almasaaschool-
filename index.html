const DEFAULT_STUDENTS = [

  ['سلطان بن ماجد الشكيلي',6,1],['حمزة بن ياسر العامري',6,2],['طلال بن سعيد الهنائي',6,2],
  ['فهد بن عبدالرحمن الزدجالي',6,3],['بدر بن سليمان الريامي',7,1],['مازن بن حمدان الحجري',7,1],

// ================= إدارة البيانات =================
let DB = { students: [], records: [], settings: { schoolName: 'مدرسة المسعى للبنين (٥-٩)' } };

function initDB() {
  const saved = localStorage.getItem('almasaa_v13_2');
  if (saved) {
    try { DB = JSON.parse(saved); } catch(e) {}
  }
  if (!DB.students || DB.students.length === 0) {
    DB.students = DEFAULT_STUDENTS.map((s, i) => ({
      id: 'S' + (i+1), name: s[0], grade: s[1], section: s[2], phone: ''
    }));
  }
  saveDB();
}

function saveDB() {
  localStorage.setItem('almasaa_v13_2', JSON.stringify(DB));
}

// ================= الدخول والتنقل =================
function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  
  if (u === 'almasaa' && p === '') {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    renderMenu();
    renderPage('home');
  } else {
    const err = document.getElementById('loginErr');
    err.classList.remove('hidden');
    setTimeout(() => err.classList.add('hidden'), 3000);
  }
}

let currentPage = 'home';

function renderMenu() {
  const items = [
    { id: 'home', label: 'الرئيسية', icon: '🏠' },
    { id: 'entry', label: 'تسجيل سلوك', icon: '✍️' },
    { id: 'records', label: 'سجل السلوكيات', icon: '📋' }

  document.getElementById('navMenu').innerHTML = items.map(item => `
    <button onclick="renderPage('${item.id}')" class="w-full text-right px-4 py-2 rounded-lg font-bold text-sm ${currentPage === item.id ? 'bg-emerald-700 text-white' : 'text-slate-700 hover:bg-emerald-50'}">
      <span class="ml-2">${item.icon}</span> ${item.label}
    </button>

}

// ================= محرك التدرج التلقائي =================
function suggestAction() {
  const sid = document.getElementById('selStudent').value;
  const bid = document.getElementById('selBehavior').value;
  const selAction = document.getElementById('selAction');
  const hint = document.getElementById('suggestHint');

  if (!sid || !bid) return;

  const behavior = BEHAVIORS.find(b => b.id === bid);
  if (!behavior) return;

  const past = DB.records.filter(r => r.studentId === sid && r.behaviorId === bid);
  const occurrences = past.length;

  let suggestedActId = 'A1';

  if (behavior.cat === 'تأخر دراسي') {
    if (occurrences === 0) suggestedActId = 'A1'; 
    else if (occurrences === 1) suggestedActId = 'A2'; 
    else if (occurrences === 2) suggestedActId = 'A3'; 
    else if (occurrences === 3) suggestedActId = 'A4'; 
    else suggestedActId = 'A7'; 
  } 
  else if (behavior.cat === 'غياب') {
    if (behavior.id === 'B_G1') suggestedActId = 'A2';
    else if (behavior.id === 'B_G2') suggestedActId = 'A3';
    else if (behavior.id === 'B_G3') suggestedActId = 'A4';
    else if (behavior.id === 'B_G4') suggestedActId = 'A5';
    else suggestedActId = 'A3';
  } 
  else {
    let nextLevel = (behavior.level || 1) + occurrences;
    if (nextLevel > 6) nextLevel = 6;
    
    if (nextLevel === 1) suggestedActId = 'A1';
    else if (nextLevel === 2) suggestedActId = 'A3';
    else if (nextLevel === 3) suggestedActId = 'A4';
    else if (nextLevel === 4) suggestedActId = 'A6';
    else if (nextLevel === 5) suggestedActId = 'A8';
    else suggestedActId = 'A11';
  }

  selAction.value = suggestedActId;
  if (occurrences > 0) {
    hint.textContent = `(تكرار رقم ${occurrences + 1} - تدرج لائحي)`;
  } else {
    hint.textContent = '(المرة الأولى - تدرج لائحي)';
  }
  
  updateRegBox();
}

function updateRegBox() {
  const actId = document.getElementById('selAction').value;
  const act = ACTIONS.find(a => a.id === actId);
  const box = document.getElementById('regBox');
  const text = document.getElementById('regText');
  if (act && act.desc) {
    box.classList.remove('hidden');
    text.textContent = act.desc;
  } else {
    box.classList.add('hidden');
  }
}

// ================= حفظ وطباعة السجلات =================
function saveRecord() {
  const sid = document.getElementById('selStudent').value;
  const bid = document.getElementById('selBehavior').value;
  const aid = document.getElementById('selAction').value;
  const metPerson = document.getElementById('metPerson').value.trim();

  if (!sid || !bid) {
    alert('يرجى اختيار الطالب والسلوك');
    return;
  }

  const b = BEHAVIORS.find(x => x.id === bid);
  const a = ACTIONS.find(x => x.id === aid);
  
  const past = DB.records.filter(r => r.studentId === sid && r.behaviorId === bid);
  const occurrence = past.length + 1;

  const record = {
    id: 'R' + Date.now(),
    studentId: sid,
    behaviorId: bid,
    behaviorName: b.name,
    actionId: aid,
    actionName: a.name,
    regulationText: a.desc,
    occurrence: occurrence,
    metPerson: metPerson,
    points: b.points,
    createdAt: Date.now()
  };

  DB.records.push(record);
  saveDB();
  
  alert('تم تسجيل السلوك بنجاح ✓');
  renderPage('records');
}

function deleteRecord(id) {
  if (confirm('حذف هذا السجل؟')) {
    DB.records = DB.records.filter(r => r.id !== id);
    saveDB();
    renderPage('records');
  }
}
