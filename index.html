function initDB() {
  let saved = localStorage.getItem('almasaa_v14') || localStorage.getItem('almasaa_v13');
  if (saved) { try { DB = JSON.parse(saved); } catch(e){} }
  if (!DB.students || DB.students.length === 0) {
    DB.students = DEFAULT_STUDENTS.map((s, i) => ({
      id: 'S' + (i+1), name: s[0], grade: s[1], section: s[2], phone: ''
    }));
  }
  if (!DB.records) DB.records = [];
  if (!DB.settings) DB.settings = { schoolName: 'مدرسة المسعى للبنين (٥-٩)', principal: '' };
  saveDB();
}

function saveDB() {
  localStorage.setItem('almasaa_v14', JSON.stringify(DB));
  if (CLOUD.enabled && CLOUD.online !== false) cloudPush();
}

async function cloudPush() {
  if (!sbClient || CLOUD.syncing) return;
  CLOUD.syncing = true;
  try {
    await sbClient.from('app_data').upsert({ id: 'main', payload: DB, updated_at: new Date().toISOString() });
  } catch(e) { console.warn('cloudPush error:', e); }
  CLOUD.syncing = false;
}

async function cloudPull(silent=true) {
  if (!sbClient || CLOUD.syncing) return;
  if (!navigator.onLine) return;
  try {
    CLOUD.syncing = true;
    const { data } = await sbClient.from('app_data').select('payload').eq('id', 'main').single();
    if (data && data.payload && data.payload.students) {
      const incoming = JSON.stringify(data.payload);
      const current = JSON.stringify(DB);
      if (incoming !== current) {
        DB = data.payload;
        if (!DB.records) DB.records = [];
        localStorage.setItem('almasaa_v14', JSON.stringify(DB));
        // لا تُعد الرسم إذا كان المستخدم يعبئ نموذجاً
        if (!formDirty && !document.getElementById('appScreen').classList.contains('hidden')) {
          renderPage(currentPage);
        }
        if (!silent) showToast('تمت المزامنة مع السحابة ✓');
      } else if (!silent) showToast('بياناتك محدثة مسبقاً');
    }
  } catch(e) { console.warn('cloudPull error:', e); if(!silent) showToast('فشلت المزامنة — تحقق من الإنترنت'); }
  CLOUD.syncing = false;
}

function manualSync() {
  const b = document.getElementById('syncBtn');
  b.textContent = '⏳ جارٍ المزامنة...';
  b.disabled = true;
  cloudPush().then(() => cloudPull(false)).finally(() => {
    b.textContent = '🔄 مزامنة السحابة';
    b.disabled = false;
  });
}

// ======================= محرك التدرج السلوكي =======================
function getEscalation(behavior) {
  if (behavior && Array.isArray(behavior.escalation) && behavior.escalation.length) return behavior.escalation;
  // سلسلة افتراضية حسب المستوى (احتياطية فقط)
  const map = {
    1:['A1','A2','A3','A4','A5'],
    2:['A2','A3','A4','A5','A6'],
    3:['A3','A4','A5','A6','A8'],
    4:['A4','A5','A6','A8','A11'],
    5:['A5','A6','A8','A11'],
    6:['A8','A11']
  };
  return map[behavior.level] || map[1];
}

function getEscalationState(studentId, behaviorId) {
  const behavior = BEHAVIORS.find(b => b.id === behaviorId);
  if (!behavior) return null;
  const esc = getEscalation(behavior);
  const pastCount = DB.records.filter(r => r.studentId === studentId && r.behaviorId === behaviorId).length;
  const stepIdx = Math.min(pastCount, esc.length - 1);
  const suggestedActionId = esc[stepIdx];
  return { behavior, esc, pastCount, stepIdx, suggestedActionId };
}

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  if (u === 'almasaa' && (p === '' || p === 'almasaa')) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    renderMenu();
    renderPage('home');
    cloudPull();
  } else {
    const err = document.getElementById('loginErr');
    err.classList.remove('hidden');
    setTimeout(() => err.classList.add('hidden'), 3000);
  }
}

function doLogout() {
  if (!confirm('تسجيل الخروج؟')) return;
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  formDirty = false;
}

function onEntryChange() {
  const sid = document.getElementById('selStudent').value;
  const bid = document.getElementById('selBehavior').value;
  formDirty = !!(sid || bid);

  // إظهار حقل الاسم المخصص
  const customBox = document.getElementById('customBox');
  if (bid === 'B_OTHER') customBox.classList.remove('hidden'); else customBox.classList.add('hidden');

  const preview = document.getElementById('escalationPreview');
  if (!sid || !bid) { preview.classList.add('hidden'); updateRegBox(); return; }

  const state = getEscalationState(sid, bid);
  if (!state) { preview.classList.add('hidden'); return; }

  const student = DB.students.find(x => x.id === sid);
  const { behavior, esc, pastCount, stepIdx, suggestedActionId } = state;

  // اقتراح الإجراء
  document.getElementById('selAction').value = suggestedActionId;

  // عرض معاينة التسلسل
  const chain = esc.map((aid, i) => {
    const a = ACTIONS.find(x => x.id === aid);
    const isPast = i < stepIdx;
    const isCurrent = i === stepIdx;
    const cls = isCurrent ? 'bg-emerald-600 text-white font-bold shadow'
              : isPast ? 'bg-emerald-100 text-emerald-700 line-through'
              : 'bg-slate-200 text-slate-500';
    const mark = isPast ? '✓' : isCurrent ? '▶' : '○';
    return `<span class="inline-block px-2 py-1 rounded text-xs ${cls}">${mark} ${a.name}</span>`;
  }).join('<span class="text-slate-400 text-xs mx-1">←</span>');

  const currentAction = ACTIONS.find(a => a.id === suggestedActionId);

  preview.classList.remove('hidden');
  preview.innerHTML = `
    <div class="flex items-center justify-between mb-2">
      <h4 class="font-black text-emerald-800 text-sm">📊 التسلسل التصاعدي لهذا السلوك</h4>
      <span class="text-xs bg-emerald-700 text-white px-2 py-1 rounded-full font-bold">
        التكرار ${pastCount + 1} — الخطوة ${stepIdx + 1} من ${esc.length}
      </span>
    </div>
    <div class="flex flex-wrap items-center gap-1 mb-3">${chain}</div>
    <div class="text-xs bg-white rounded-lg p-3 border border-emerald-200">
      <div><strong>الطالب:</strong> ${student.name} — صف ${student.grade}/${student.section}</div>
      <div class="mt-1"><strong>عدد التكرارات السابقة لهذا السلوك:</strong> ${pastCount}</div>
      <div class="mt-1 text-emerald-800 font-bold">▶ الإجراء المقترح: ${currentAction.name}</div>
      ${pastCount > 0 ? `<div class="mt-2 text-[11px] text-slate-600 italic">
        الإجراء التصاعدي مبني على: المستوى ${behavior.level} + ${pastCount} تكرار سابق ⇒ الخطوة ${stepIdx + 1}
      </div>` : ''}
    </div>
  `;

  updateRegBox();
}

function onActionChange() { updateRegBox(); }

function updateRegBox() {
  const actId = document.getElementById('selAction')?.value;
  const act = ACTIONS.find(a => a.id === actId);
  const box = document.getElementById('regBox');
  const text = document.getElementById('regText');
  if (!box || !text) return;
  if (act && act.desc) { box.classList.remove('hidden'); text.textContent = act.desc; }
  else box.classList.add('hidden');
}

function saveRecord() {
  const sid = document.getElementById('selStudent').value;
  const bid = document.getElementById('selBehavior').value;
  const aid = document.getElementById('selAction').value;
  const customName = document.getElementById('customName')?.value.trim() || '';
  const metWith = document.getElementById('metWith').value.trim();
  const teacher = document.getElementById('teacher').value.trim();
  const notes = document.getElementById('notes').value.trim();

  if (!sid || !bid) return showToast('⚠️ يرجى اختيار الطالب والسلوك', 'error');
  if (bid === 'B_OTHER' && !customName) return showToast('⚠️ يرجى كتابة وصف السلوك', 'error');

  const behavior = BEHAVIORS.find(x => x.id === bid);
  const action = ACTIONS.find(x => x.id === aid);
  if (!action) return showToast('⚠️ الإجراء غير صحيح', 'error');

  // حساب الحالة التصاعدية لهذا التكرار
  const state = getEscalationState(sid, bid);
  const { esc } = state;

  const record = {
    id: 'R' + Date.now() + Math.floor(Math.random()*1000),
    studentId: sid,
    behaviorId: bid,
    behaviorName: customName || behavior.name,
    customBehaviorName: customName || '',
    actionId: aid,
    actionName: action.name,
    regulationText: action.desc,
    points: behavior.points,
    escalationPath: esc,
    escalationStep: state.stepIdx + 1,
    escalationTotal: esc.length,
    metWith: metWith,
    teacher: teacher,
    notes: notes,
    createdAt: Date.now()
  };

  DB.records.push(record);
  saveDB();
  formDirty = false;
  showToast(`✅ تم تسجيل السلوك (الخطوة ${record.escalationStep} من ${record.escalationTotal})`);
  renderPage('records');
}

function deleteRecord(id) {
  if (!confirm('حذف هذا السجل نهائياً؟')) return;

  saveDB();
  showToast('تم حذف السجل');
  renderPage('records');
}

function exportExcel() {
  if (!DB.records.length) return showToast('لا توجد سجلات للتصدير', 'error');
  const data = DB.records.map(r => {
    const s = DB.students.find(x => x.id === r.studentId) || {};
    return {
      'التاريخ': new Date(r.createdAt).toLocaleDateString('ar-OM'),
      'الطالب': s.name || '',
      'الصف': s.grade || '',
      'الشعبة': s.section || '',
      'السلوك': r.behaviorName,
      'الإجراء': r.actionName,
      'الخطوة': r.escalationStep ? `${r.escalationStep}/${r.escalationTotal}` : '',
      'من تتم مقابلته': r.metWith || '',
      'ملاحظات': r.notes || '',
      'يراجع الأستاذ': r.teacher || ''
    };
  });
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:12},{wch:25},{wch:6},{wch:6},{wch:25},{wch:25},{wch:8},{wch:18},{wch:25},{wch:18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'السجلات');
  XLSX.writeFile(wb, `سجلات-السلوك-${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast('تم تصدير الملف ✓');
}

function backupJSON() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  showToast('تم التنزيل ✓');
}

function restoreJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.students || !data.records) throw new Error('ملف غير صالح');
      if (!confirm('سيتم استبدال البيانات الحالية. متابعة؟')) return;
      DB = data;
      saveDB(); showToast('تم الاستيراد ✓'); renderPage('settings');
    } catch(err) { showToast('⚠️ ملف غير صالح', 'error'); }
  };
  reader.readAsText(file);
}

function clearData() {
  if (!confirm('سيتم حذف جميع السجلات والطلبة نهائياً. متأكد؟')) return;
  if (!confirm('تأكيد أخير — لا يمكن التراجع!')) return;
  localStorage.removeItem('almasaa_v14');
  location.reload();
}

function openPrintModal(recordId) {
  const record = DB.records.find(x => x.id === recordId);
  if (!record) return;
  const student = DB.students.find(x => x.id === record.studentId) || {name:'—', grade:'—', section:'—'};
  const behavior = BEHAVIORS.find(x => x.id === record.behaviorId) || {name: record.behaviorName, cat:'—'};
  const esc = record.escalationPath || getEscalation(behavior);
  const stepIdx = (record.escalationStep || 1) - 1;

  const html = buildPrintSheet(record, student, behavior, esc, stepIdx);

  showModal(`
    <div class="flex justify-between items-center mb-4 no-print">
      <h3 class="text-xl font-black">معاينة التقرير</h3>
      <div class="flex gap-2">
        <button onclick="doPrint('${recordId}')" class="bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-sm">🖨️ طباعة</button>
        <button onclick="doPDF('${recordId}')" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-lg text-sm">📄 PDF</button>
        <button onclick="closeModal()" class="bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-lg text-sm">إغلاق</button>
      </div>
    </div>
    <div id="printPreview" class="bg-white border rounded-lg overflow-auto" style="max-height:75vh">
      ${html.replace(/<\/?html[^>]*>|<\/?head[^>]*>|<style>[\s\S]*?<\/style>|<\/?body[^>]*>|<\/?meta[^>]*>|<!DOCTYPE[^>]*>/gi, '')}
    </div>
  `);
}

function buildPrintSheet(record, student, behavior, esc, stepIdx) {
  const schoolName = DB.settings.schoolName || 'مدرسة المسعى للبنين (٥-٩)';
  const dateStr = new Date(record.createdAt).toLocaleDateString('ar-OM', {year:'numeric', month:'long', day:'numeric'});
  const pastCount = (record.escalationStep || 1) - 1;

  const escHTML = esc.map((aid, i) => {
    const a = ACTIONS.find(x => x.id === aid);
    const isCurrent = i === stepIdx;
    const isPast = i < stepIdx;
    const bg = isCurrent ? '#059669' : isPast ? '#D1FAE5' : '#F1F5F9';
    const color = isCurrent ? 'white' : isPast ? '#065F46' : '#64748B';
    const marker = isPast ? '✓' : isCurrent ? '▶' : '○';
    return `<div style="display:inline-block;padding:5px 10px;margin:3px;border-radius:6px;background:${bg};color:${color};font-size:11px;font-weight:${isCurrent?'bold':'normal'};border:1px solid ${isCurrent?'#047857':'#E2E8F0'}">
      ${marker} ${i+1}. ${a.name}
    </div>`;
  }).join('');

  return `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><style>
    @page { size: A4; margin: 15mm; }

function doPrint(recordId) {
  const record = DB.records.find(x => x.id === recordId);
  if (!record) return;
  const student = DB.students.find(x => x.id === record.studentId) || {};
  const behavior = BEHAVIORS.find(x => x.id === record.behaviorId) || {};
  const esc = record.escalationPath || getEscalation(behavior);
  const stepIdx = (record.escalationStep || 1) - 1;
  const html = buildPrintSheet(record, student, behavior, esc, stepIdx);

  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(iframe);
  iframe.contentDocument.write(html);
  iframe.contentDocument.close();
  setTimeout(() => {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(() => iframe.remove(), 1500);
  }, 400);
}

async function doPDF(recordId) {
  const record = DB.records.find(x => x.id === recordId);
  if (!record) return;
  const student = DB.students.find(x => x.id === record.studentId) || {};
  const behavior = BEHAVIORS.find(x => x.id === record.behaviorId) || {};
  const esc = record.escalationPath || getEscalation(behavior);
  const stepIdx = (record.escalationStep || 1) - 1;
  const html = buildPrintSheet(record, student, behavior, esc, stepIdx);

  showToast('⏳ جارٍ إنشاء PDF...');
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:white;';
  container.innerHTML = html;
  document.body.appendChild(container);
  try {
    const canvas = await html2canvas(container, { scale:2, useCORS:true, backgroundColor:'#ffffff' });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pdfWidth = 210;
    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
    pdf.save(`تقرير-${student.name}-${new Date(record.createdAt).toISOString().split('T')[0]}.pdf`);
    showToast('تم إنشاء PDF ✓');
  } catch(e) {
    console.error(e);
    showToast('⚠️ فشل إنشاء PDF', 'error');
  } finally {
    container.remove();
  }
}

function showModal(content) {
  document.getElementById('modalRoot').innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4" onclick="if(event.target === this) closeModal()">
      <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[92vh] overflow-auto p-6">${content}</div>
    </div>`;
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

let toastTimer = null;
function showToast(msg, type='success') {
  const old = document.getElementById('toastBox');
  if (old) old.remove();
  const bg = type === 'error' ? 'bg-red-600' : 'bg-emerald-700';
  const box = document.createElement('div');
  box.id = 'toastBox';
  box.className = `fixed top-4 left-1/2 -translate-x-1/2 ${bg} text-white font-bold px-6 py-3 rounded-xl shadow-2xl z-[60] text-sm`;
  box.textContent = msg;
  document.body.appendChild(box);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.remove(), 3000);
}
