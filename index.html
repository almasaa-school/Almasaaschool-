/* ============ Supabase Sync ============ */
async function cloudPush(){
  if(!sbClient||CLOUD.syncing)return;
  CLOUD.syncing=true;upCloud('⬆️ رفع...');
  try{
    const {error}=await sbClient.from('app_data').upsert({id:'main',payload:DB,updated_at:new Date().toISOString(),updated_by:USER?USER.name:''});
    CLOUD.last=Date.now();
    upCloud(error?'❌ فشل الرفع':'✅ متزامن');
  }catch(e){upCloud('⚠️ خطأ')}
  CLOUD.syncing=false;
}
async function cloudPull(silent){
  if(!sbClient)return false;
  if(!silent)upCloud('⬇️ تحميل...');
  try{
    const {data,error}=await sbClient.from('app_data').select('payload,updated_at').eq('id','main').single();
    if(error||!data||!data.payload)return false;
    const p=data.payload;
    if(!p.students||!Array.isArray(p.students))return false;
    const cloudHasData=p.students.length>0||(p.records&&p.records.length>0)||(p.users&&p.users.length>0)||(p.behaviors&&p.behaviors.length>0);
    const localHasData=DB.students.length>0||DB.records.length>0||DB.users.length>0;
    if(!cloudHasData&&localHasData){console.log('السحابة فارغة — رفع البيانات المحلية');upCloud('⬆️ رفع أولي...');await cloudPush();return false}
    if(!cloudHasData&&!localHasData){upCloud('✅ جاهز');return false}
    DB=p;
    localStorage.setItem(KEY,JSON.stringify(DB));
    CLOUD.last=new Date(data.updated_at).getTime();
    if(!silent)upCloud('✅ محدّث');
    return true;
  }catch(e){console.warn('cloudPull:',e);return false}
}
function upCloud(txt){const el=document.getElementById('cloudStatus');if(el)el.textContent=txt}
async function forcePull(){
  if(!sbClient){toast('Supabase غير مهيأ','err');return}
  if(!confirm('سيتم استبدال البيانات المحلية بالنسخة السحابية. متابعة؟'))return;
  const ok=await cloudPull(false);
  if(ok){toast('✅ تم التحديث من السحابة');setTimeout(()=>location.reload(),800)}
  else toast('السحابة فارغة — لم يتم التغيير','err');
}
async function forcePush(){
  if(!sbClient){toast('Supabase غير مهيأ','err');return}
  CLOUD.syncing=false;
  await cloudPush();

}

  document.getElementById('nav').innerHTML=NAV.filter(n=>!n.ad||isAdmin()).map(n=>{
    const a=pg===n.id;
    const b=(n.id==='alerts'&&(al+fu)>0)?`<span class="bg-red-600 text-white text-xs rounded-full px-1.5 font-black">${al+fu}</span>`:'';
    return `<button onclick="go('${n.id}')" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-bold text-sm ${a?'bg-p text-white shadow':'text-slate-700 hover:bg-ps'}"><span class="text-lg">${n.i}</span><span class="flex-1 text-right">${n.l}</span>${b}</button>`;
  }).join('');
  document.getElementById('sNm').textContent=DB.config.schoolName;
  const l=document.getElementById('sLg');
  l.innerHTML=DB.config.logoR?`<img src="${DB.config.logoR}" style="width:100%;height:100%;object-fit:contain">`:'<span class="text-amber-400 text-2xl font-black">م</span>';
}
function go(p){
  const n=NAV.find(x=>x.id===p);
  if(n&&n.ad&&!isAdmin()){toast('للمدير فقط','err');return}
  pg=p;nav();
  if(window.innerWidth<1024)document.getElementById('sb').classList.add('translate-x-full');
  render();
  window.scrollTo(0,0);
}

/* ============ حسابات ============ */
function alerts(){
  const now=Date.now();
  const r=DB.records.filter(x=>now-x.createdAt<=30*864e5);
  const c={};r.forEach(x=>{c[x.studentId]=(c[x.studentId]||0)+1});
  return Object.entries(c).filter(([_,n])=>n>=3).map(([sid,n])=>{const s=gS(sid);return s?{id:sid+'_30',sid,sev:n>=5?'h':'m',title:'تكرار المخالفات',msg:`${s.name} (${s.grade}/${s.section}): ${n} مخالفة`,n}:null}).filter(Boolean).filter(a=>!DB.resolved.includes(a.id));
}
function follow(){
  const now=Date.now();
  return DB.followups.filter(f=>!f.resolved).map(f=>{const s=gS(f.studentId),r=DB.records.find(x=>x.id===f.recordId);return {...f,s,r,d:Math.floor((now-f.createdAt)/864e5)}}).filter(f=>f.s&&f.d>=1);
}
function stats(id){const r=DB.records.filter(x=>x.studentId===id);return {count:r.length,points:r.reduce((a,b)=>a+(b.points||0),0)}}

function bk(){

    const t=new Date(),st=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}_${String(t.getHours()).padStart(2,'0')}-${String(t.getMinutes()).padStart(2,'0')}`;

function restore(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;if(!confirm('استبدال البيانات؟'))return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);DB=d.data||d;localStorage.setItem(KEY,JSON.stringify(DB));alert('✅ تم');location.reload()}catch(x){alert('خطأ')}};r.readAsText(f)};
  i.click();
}

function wa(phone,msg){
  if(!phone){toast('لا رقم','err');return}
  let c=String(phone).replace(/\D/g,'');
  if(c.startsWith('00'))c=c.slice(2);
  if(!c.startsWith('968')&&c.length<=8)c='968'+c;
  window.open(`https://wa.me/${c}?text=${encodeURIComponent(msg)}`,'_blank');
}
async function pdf(html,fn,phone,msg){
  toast('⏳ جاري PDF...');
  const ifr=document.createElement('iframe');ifr.style.cssText='position:fixed;left:-9999px;top:0;width:800px;height:1200px;border:none';document.body.appendChild(ifr);
  const d=ifr.contentDocument;d.open();d.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><style>body{font-family:'Cairo',sans-serif;padding:20px;background:#fff;width:760px;font-size:12pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px}</style></head><body>${html}</body></html>`);d.close();
  await new Promise(r=>setTimeout(r,1500));
  try{
    const c=await html2canvas(d.body,{scale:2,useCORS:true,backgroundColor:'#fff',width:760,windowWidth:760});
    const img=c.toDataURL('image/png');
    const {jsPDF}=window.jspdf;const p=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pw=p.internal.pageSize.getWidth(),ph=p.internal.pageSize.getHeight();
    const iw=pw-10,ih=(c.height*iw)/c.width;
    if(ih<=ph-10)p.addImage(img,'PNG',5,5,iw,ih);
    else{let rm=ih,of=0;while(rm>0){const phh=Math.min(ph-10,rm);const c2=document.createElement('canvas');c2.width=c.width;c2.height=(phh/ih)*c.height;c2.getContext('2d').drawImage(c,0,of*c.height/ih,c.width,c2.height,0,0,c.width,c2.height);p.addImage(c2.toDataURL('image/png'),'PNG',5,5,iw,phh);of+=phh;rm-=phh;if(rm>0)p.addPage()}}
    const b=p.output('blob');const file=new File([b],fn,{type:'application/pdf'});
    document.body.removeChild(ifr);
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],text:msg||'',title:fn});toast('✅ قائمة المشاركة')}
      catch(e){if(e.name!=='AbortError'){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a)}}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);
      toast('💾 تم تنزيل PDF');setTimeout(()=>wa(phone,msg||''),500);
    }
  }catch(e){if(ifr.parentNode)document.body.removeChild(ifr);toast('فشل PDF','err')}
}

let AF={f:'',t:'',g:'',sc:'',p:'month'};
let charts={};
function setP(p){const n=new Date(),e=n.getTime();let s=0;if(p==='week')s=e-7*864e5;else if(p==='month')s=e-30*864e5;else if(p==='term')s=e-90*864e5;else if(p==='year')s=e-365*864e5;AF.p=p;AF.f=s?new Date(s).toISOString().slice(0,10):'';AF.t=new Date(e).toISOString().slice(0,10);render()}
function ana(){
  let r=DB.records.slice();
  if(AF.f)r=r.filter(x=>x.createdAt>=new Date(AF.f).getTime());
  if(AF.t)r=r.filter(x=>x.createdAt<=new Date(AF.t).getTime()+864e5);
  if(AF.g)r=r.filter(x=>{const s=gS(x.studentId);return s&&s.grade===+AF.g});
  if(AF.sc)r=r.filter(x=>{const s=gS(x.studentId);return s&&s.section===+AF.sc});
  const bc={};r.forEach(x=>{const k=x.behaviorName||'—';bc[k]=(bc[k]||0)+1});
  const b=Object.entries(bc).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count);
  const gc={};r.forEach(x=>{const s=gS(x.studentId);if(s)gc[s.grade]=(gc[s.grade]||0)+1});
  const g=GR.map(x=>({grade:x,count:gc[x]||0}));
  const sc={};r.forEach(x=>{const s=gS(x.studentId);if(!s)return;const k=s.grade+'|'+s.section;if(!sc[k])sc[k]={grade:s.grade,section:s.section,count:0};sc[k].count++});
  const sec=Object.values(sc).sort((a,b)=>b.count-a.count);
  const ac={};r.forEach(x=>{const k=x.actionName||'—';ac[k]=(ac[k]||0)+1});
  const a=Object.entries(ac).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count);
  const uc={};r.forEach(x=>{uc[x.studentId]=(uc[x.studentId]||0)+1});
  const u=Object.entries(uc).map(([sid,c])=>({student:gS(sid),count:c})).filter(x=>x.student).sort((a,b)=>b.count-a.count).slice(0,10);
  return {b,g,sec,a,u,total:r.length};
}

function drawCharts(){
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={};

  const p=getComputedStyle(document.documentElement).getPropertyValue('--p').trim()||'#047857';
  const pal=['#047857','#0284C7','#7C3AED','#D97706','#DC2626','#0D9488','#4F46E5','#C026D3'];
  if(document.getElementById('cA')){const t=A.a.slice(0,6),tt=t.reduce((s,x)=>s+x.count,0)||1;charts.a=new Chart(document.getElementById('cA'),{type:'doughnut',data:{labels:t.map(x=>x.name),datasets:[{data:t.map(x=>x.count),backgroundColor:pal,borderWidth:3,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed} (${Math.round(c.parsed/tt*100)}%)`}}}}})}

  if(document.getElementById('cB')){const t=A.b.slice(0,7);charts.b=new Chart(document.getElementById('cB'),{type:'bar',data:{labels:t.map(x=>x.name),datasets:[{data:t.map(x=>x.count),backgroundColor:'#DC2626',borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:1,precision:0}}}}})}
  if(document.getElementById('cS')){const t=A.sec.slice(0,8);charts.s=new Chart(document.getElementById('cS'),{type:'bar',data:{labels:t.map(x=>`شعبة ${x.section} - صف ${x.grade}`),datasets:[{data:t.map(x=>x.count),backgroundColor:'#7C3AED',borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:1,precision:0}}}}})}
}

let SF={q:'',g:'',sc:''};
function renderStudents(){
  const list=DB.students.filter(s=>{if(SF.q&&!s.name.includes(SF.q))return false;if(SF.g&&s.grade!==+SF.g)return false;if(SF.sc&&s.section!==+SF.sc)return false;return true}).sort((a,b)=>a.grade-b.grade||a.section-b.section||a.name.localeCompare(b.name,'ar'));
  return `<div class="space-y-4"><header style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px"><div><h1 style="font-size:24px;font-weight:900">👥 إدارة الطلبة</h1><p style="font-size:13px;color:#64748b;margin-top:4px">${DB.students.length} طالب</p></div><div style="display:flex;gap:8px"><button onclick="imp()" class="bg-p text-white font-bold px-4 py-2.5 rounded-xl text-sm">📥 رفع</button><button onclick="edStu('')" class="bg-white border-2 border-slate-200 font-bold px-4 py-2.5 rounded-xl text-sm">+ إضافة</button></div></header>
  <div class="bg-white rounded-2xl p-4 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-2"><input value="${esc(SF.q)}" oninput="SF.q=this.value;render()" placeholder="🔍 بحث..." class="rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"><select onchange="SF.g=this.value;render()" class="rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white"><option value="">كل الصفوف</option>${GR.map(g=>`<option ${SF.g==g?'selected':''}>${g}</option>`).join('')}</select><select onchange="SF.sc=this.value;render()" class="rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white"><option value="">كل الشعب</option>${SC.map(s=>`<option ${SF.sc==s?'selected':''}>${s}</option>`).join('')}</select></div>
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden"><div style="overflow-x:auto"><table style="width:100%;font-size:14px"><thead style="background:#f8fafc;border-bottom:1px solid #e2e8f0"><tr style="text-align:right"><th style="padding:12px;font-weight:900;font-size:12px">#</th><th style="padding:12px;font-weight:900;font-size:12px">الاسم</th><th style="padding:12px;font-weight:900;font-size:12px">الصف</th><th style="padding:12px;font-weight:900;font-size:12px">الشعبة</th><th style="padding:12px;font-weight:900;font-size:12px">هاتف</th><th style="padding:12px;font-weight:900;font-size:12px">❤️</th><th style="padding:12px;font-weight:900;font-size:12px">المخالفات</th><th style="padding:12px;font-weight:900;font-size:12px">إجراءات</th></tr></thead><tbody>${list.map((s,i)=>{const st=stats(s.id);const h=DB.health.some(x=>x.studentId===s.id);return `<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:12px;font-size:12px;color:#94a3b8">${i+1}</td><td style="padding:12px;font-weight:bold;font-size:12px">${esc(s.name)}</td><td style="padding:12px;font-size:12px">${s.grade}</td><td style="padding:12px;font-size:12px">${s.section}</td><td style="padding:12px;font-size:12px">${s.phone?esc(s.phone):'—'}</td><td style="padding:12px;font-size:12px">${h?'❤️':'—'}</td><td style="padding:12px;font-size:12px;font-weight:bold;color:#dc2626">${st.count}</td><td style="padding:12px"><button onclick="edStu('${s.id}')" style="padding:6px;border-radius:8px">✏️</button></td></tr>`}).join('')}${list.length===0?'<tr><td colspan="8" style="text-align:center;padding:48px;color:#94a3b8">لا طلبة</td></tr>':''}</tbody></table></div></div></div>`;
}
function imp(){document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">رفع قائمة الطلبة</h3><div style="margin-bottom:16px"><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:8px">لصق من Excel</label><p style="font-size:12px;color:#64748b;margin-bottom:8px">كل سطر: الاسم، الصف، الشعبة، رقم ولي الأمر</p><textarea id="pA" rows="8" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-mono"></textarea></div><div style="margin-bottom:16px"><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:8px">أو ملف Excel</label><input type="file" id="xF" accept=".xlsx,.xls,.csv" class="text-sm"></div><div style="margin-bottom:16px"><label style="display:flex;gap:8px;font-size:14px"><input type="checkbox" id="rA">حذف الطلبة الحاليين</label></div><div style="display:flex;gap:8px"><button onclick="doImp()" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">رفع</button><button onclick="this.closest('.mdl').remove()" class="px-5 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function doImp(){
  const p=document.getElementById('pA').value.trim(),f=document.getElementById('xF').files[0],r=document.getElementById('rA').checked;
  const imp=[];
  const ps=l=>{const parts=l.split(/[,\t،]/).map(x=>x.trim()).filter(x=>x);if(parts.length<3)return null;const[n,g,s,ph]=parts;const gn=parseInt(g),sn=parseInt(s);if(!n||isNaN(gn)||isNaN(sn)||!GR.includes(gn))return null;return{name:n,grade:gn,section:sn,phone:ph||''}};
  if(p)p.split('\n').forEach(l=>{const x=ps(l);if(x)imp.push(x)});
  const proc=rows=>{rows.forEach(row=>{const[n,g,s,ph]=row.map(x=>String(x==null?'':x).trim());const gn=parseInt(g),sn=parseInt(s);if(n&&!isNaN(gn)&&!isNaN(sn)&&GR.includes(gn))imp.push({name:n,grade:gn,section:sn,phone:ph||''})});fin()};
  const fin=()=>{if(!imp.length){toast('لا طلبة','err');return}if(r)DB.students=[];const ex=new Set(DB.students.map(s=>s.name+'|'+s.grade+'|'+s.section));let a=0,sk=0;imp.forEach(x=>{const k=x.name+'|'+x.grade+'|'+x.section;if(ex.has(k)){sk++;return}ex.add(k);DB.students.push({id:uid0('S'),...x});a++});save();document.getElementById('mdl').innerHTML='';toast(`✓ ${a} طالب`);render()};
  if(f){const r=new FileReader();r.onload=e=>{try{const d=new Uint8Array(e.target.result);const wb=XLSX.read(d,{type:'array'});proc(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}))}catch(x){toast('خطأ','err')}};r.readAsArrayBuffer(f)}else fin();
}
function edStu(id){const s=id?gS(id):{name:'',grade:5,section:1,phone:''};document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">${id?'تعديل':'إضافة'}</h3><div style="display:flex;flex-direction:column;gap:12px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الاسم *</label><input id="eN" value="${esc(s.name)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الصف</label><select id="eG" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white">${GR.map(g=>`<option ${s.grade===g?'selected':''}>${g}</option>`).join('')}</select></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الشعبة</label><select id="eS" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white">${SC.map(x=>`<option ${s.section===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">هاتف ولي الأمر</label><input id="eP" value="${esc(s.phone||'')}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="svStu('${id||''}')" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">حفظ</button>${id?`<button onclick="dlStu('${id}')" class="px-4 bg-red-50 text-red-600 font-bold py-2.5 rounded-xl">حذف</button>`:''}<button onclick="this.closest('.mdl').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function svStu(id){const n=document.getElementById('eN').value.trim();if(!n){toast('أدخل الاسم','err');return}const d={name:n,grade:+document.getElementById('eG').value,section:+document.getElementById('eS').value,phone:document.getElementById('eP').value.trim()};if(id)Object.assign(gS(id),d);else DB.students.push({id:uid0('S'),...d});save();document.getElementById('mdl').innerHTML='';toast('✓');render()}
function dlStu(id){if(!confirm('حذف؟'))return;DB.students=DB.students.filter(s=>s.id!==id);DB.records=DB.records.filter(r=>r.studentId!==id);DB.health=DB.health.filter(h=>h.studentId!==id);DB.followups=DB.followups.filter(f=>f.studentId!==id);save();document.getElementById('mdl').innerHTML='';toast('✓');render()}

function renderHealth(){

  ${list.length===0?`<div class="bg-white rounded-2xl p-12 text-center shadow-sm"><div style="font-size:48px;margin-bottom:12px">❤️</div><div style="font-weight:900;color:var(--p);font-size:18px">لا حالات مسجلة</div></div>`:`<div class="bg-white rounded-2xl shadow-sm overflow-hidden"><table style="width:100%;font-size:14px"><thead style="background:#f8fafc;border-bottom:1px solid #e2e8f0"><tr style="text-align:right"><th style="padding:12px;font-weight:900;font-size:12px">الطالب</th><th style="padding:12px;font-weight:900;font-size:12px">الصف/الشعبة</th><th style="padding:12px;font-weight:900;font-size:12px">الحالة</th><th style="padding:12px;font-weight:900;font-size:12px">ملاحظات</th><th style="padding:12px;font-weight:900;font-size:12px">إجراءات</th></tr></thead><tbody>${list.map(h=>`<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:12px;font-weight:bold;font-size:12px">${esc(h.student.name)}</td><td style="padding:12px;font-size:12px">${h.student.grade}/${h.student.section}</td><td style="padding:12px;font-size:12px"><span style="background:#ffe4e6;color:#be123c;padding:4px 8px;border-radius:4px;font-weight:bold">${esc(h.condition)}</span></td><td style="padding:12px;font-size:12px">${esc(h.notes||'—')}</td><td style="padding:12px"><button onclick="edH('${h.id}')" style="padding:6px">✏️</button><button onclick="dlH('${h.id}')" style="padding:6px">🗑️</button></td></tr>`).join('')}</tbody></table></div>`}</div>`;

function addH(){HP='';document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">إضافة حالة صحية</h3><div style="display:flex;flex-direction:column;gap:12px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الطالب *</label><div style="position:relative"><input id="hS" placeholder="اكتب..." oninput="sH()" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"><div id="hD" class="dd hidden"></div></div><div id="hP"></div></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الحالة *</label><input id="hC" placeholder="ربو، سكري..." class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">ملاحظات</label><textarea id="hN" rows="2" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></textarea></div></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="svH()" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">حفظ</button><button onclick="this.closest('.mdl').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function sH(){const q=document.getElementById('hS').value.trim();const d=document.getElementById('hD');const list=DB.students.filter(s=>!q||s.name.includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ar')).slice(0,20);if(!list.length){d.innerHTML='<div style="padding:12px;text-align:center;color:#94a3b8;font-size:13px">لا نتائج</div>';d.classList.remove('hidden');return}d.innerHTML=list.map(s=>`<div class="ddi" onclick="pkH('${s.id}')"><div><div style="font-size:14px;font-weight:bold">${esc(s.name)}</div><div style="font-size:12px;color:#64748b">صف ${s.grade} · شعبة ${s.section}</div></div></div>`).join('');d.classList.remove('hidden')}
function pkH(sid){HP=sid;const s=gS(sid);document.getElementById('hS').value=s.name;document.getElementById('hD').classList.add('hidden');document.getElementById('hD').innerHTML='';document.getElementById('hP').innerHTML=`<div style="padding:8px;background:var(--s);border-radius:8px;font-size:12px;font-weight:bold;margin-top:4px">✓ ${esc(s.name)}</div>`}

function edH(id){const h=DB.health.find(x=>x.id===id);if(!h)return;const s=gS(h.studentId);document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">تعديل</h3><div style="padding:8px;background:#f8fafc;border-radius:8px;font-size:14px;font-weight:bold;margin-bottom:12px">${esc(s.name)} — ${s.grade}/${s.section}</div><div style="display:flex;flex-direction:column;gap:12px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الحالة</label><input id="hCE" value="${esc(h.condition)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">ملاحظات</label><textarea id="hNE" rows="2" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm">${esc(h.notes||'')}</textarea></div></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="upH('${id}')" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">حفظ</button><button onclick="dlH('${id}')" class="px-4 bg-red-50 text-red-600 font-bold py-2.5 rounded-xl">حذف</button><button onclick="this.closest('.mdl').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function upH(id){const h=DB.health.find(x=>x.id===id);h.condition=document.getElementById('hCE').value.trim();h.notes=document.getElementById('hNE').value.trim();save();document.getElementById('mdl').innerHTML='';toast('✓');render()}
function dlH(id){if(!confirm('حذف؟'))return;DB.health=DB.health.filter(x=>x.id!==id);save();document.getElementById('mdl').innerHTML='';toast('✓');render()}

/* ============ التحويل الصحي ============ */
let HT='';
function renderHealthTransfer(){
  return `<div class="max-w-4xl space-y-5"><header><h1 style="font-size:24px;font-weight:900">🌙 التحويل للوحدة الصحية</h1><p style="font-size:13px;color:#64748b;margin-top:4px">📅 ${today()}</p></header><div class="bg-white rounded-2xl p-6 shadow-sm space-y-4">
  <div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:8px">اختيار الطالب</label><div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-2"><div style="position:relative"><input id="htS" placeholder="اكتب..." oninput="sHt()" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm"><div id="htD" class="dd hidden"></div></div><select id="htG" onchange="sHt()" class="rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-bold bg-white"><option value="">كل الصفوف</option>${GR.map(g=>`<option>${g}</option>`).join('')}</select><select id="htSc" onchange="sHt()" class="rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-bold bg-white"><option value="">كل الشعب</option>${SC.map(s=>`<option>${s}</option>`).join('')}</select></div><div id="htP"></div></div>
  <div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:8px">سبب التحويل</label><textarea id="htR" rows="2" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm" placeholder="اختياري..."></textarea></div>
  <div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:8px">المُسجل *</label><select id="htU" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-bold bg-white">${DB.users.map(u=>`<option value="${u.id}">${esc(u.name)} — ${esc(u.title)}</option>`).join('')}</select></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="pHT()" class="flex-1 bg-p text-white font-black py-3.5 rounded-xl">🖨️ طباعة</button><button onclick="waHT()" class="flex-1 bg-emerald-600 text-white font-black py-3.5 rounded-xl">💬 واتساب (نص)</button><button onclick="waHTPDF()" class="flex-1 bg-blue-600 text-white font-black py-3.5 rounded-xl">📄 واتساب (PDF)</button></div></div></div>`;
}
function sHt(){const q=document.getElementById('htS').value.trim(),g=document.getElementById('htG').value,s=document.getElementById('htSc').value,d=document.getElementById('htD');const list=DB.students.filter(x=>{if(g&&x.grade!==+g)return false;if(s&&x.section!==+s)return false;if(q&&!x.name.includes(q))return false;return true}).sort((a,b)=>a.name.localeCompare(b.name,'ar')).slice(0,25);if(!list.length){d.innerHTML='<div style="padding:12px;text-align:center;color:#94a3b8;font-size:13px">لا نتائج</div>';d.classList.remove('hidden');return}d.innerHTML=list.map(x=>`<div class="ddi" onclick="pkHt('${x.id}')"><div><div style="font-size:14px;font-weight:bold">${esc(x.name)}</div><div style="font-size:12px;color:#64748b">صف ${x.grade} · شعبة ${x.section}</div></div></div>`).join('');d.classList.remove('hidden')}
function pkHt(sid){HT=sid;const s=gS(sid);document.getElementById('htS').value=s.name;document.getElementById('htD').classList.add('hidden');document.getElementById('htD').innerHTML='';document.getElementById('htP').innerHTML=`<div style="padding:8px;background:var(--s);border-radius:8px;font-size:12px;font-weight:bold;margin-top:4px">✓ ${esc(s.name)} — صف ${s.grade}/${s.section}</div>`}
function pHT(){if(!HT){toast('اختر','err');return}const r=document.getElementById('htR').value.trim();DB.referrals.push({id:uid0('HR'),studentId:HT,reason:r,createdAt:Date.now()});save();prt(healthHTML(HT,r))}
function waHT(){if(!HT){toast('اختر','err');return}const s=gS(HT);if(!s.phone){toast('لا رقم','err');return}wa(s.phone,fill(DB.config.waHealth,{student:s.name,grade:s.grade,section:s.section,reason:document.getElementById('htR').value.trim()?' للسبب التالي: '+document.getElementById('htR').value.trim():'',date:fmtDT(Date.now()),school:DB.config.schoolName}))}
function waHTPDF(){if(!HT){toast('اختر','err');return}const s=gS(HT);if(!s.phone){toast('لا رقم','err');return}const r=document.getElementById('htR').value.trim();const fn=`تحويل_${s.name.replace(/\s+/g,'_')}.pdf`;pdf(healthHTML(HT,r),fn,s.phone,fill(DB.config.waHealth,{student:s.name,grade:s.grade,section:s.section,reason:r?' للسبب التالي: '+r:'',date:fmtDT(Date.now()),school:DB.config.schoolName}))}

/* ============ تقرير الوحدة ============ */
function renderHealthReport(){
  const list=DB.referrals.map(h=>({...h,student:gS(h.studentId)})).filter(h=>h.student);
  const byG={};GR.forEach(g=>byG[g]=0);list.forEach(h=>{if(h.student)byG[h.student.grade]++});
  const mx=Math.max(...Object.values(byG),1);
  return `<div class="space-y-4"><header style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px"><div><h1 style="font-size:24px;font-weight:900">📊 تقرير الوحدة الصحية</h1><p style="font-size:13px;color:#64748b;margin-top:4px">${list.length} تحويل · 📅 ${today()}</p></div><button onclick="pHR()" class="bg-white border-2 border-slate-200 font-bold px-4 py-2.5 rounded-xl text-sm">🖨️ طباعة</button></header>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-3">${st('إجمالي',list.length,'🌙','#dc2626,#991b1b')}${GR.slice(0,4).map(g=>st('الصف '+g,byG[g],'📚','#6366f1,#3730a3')).join('')}</div>
  <div class="bg-white rounded-2xl p-5 shadow-sm"><h3 style="font-weight:900;margin-bottom:16px">📊 التوزيع حسب الصفوف</h3><div style="display:flex;flex-direction:column;gap:12px">${GR.map(g=>`<div style="display:flex;align-items:center;gap:12px"><div style="width:64px;font-size:14px;font-weight:bold">الصف ${g}</div><div style="flex:1;height:20px;background:#f1f5f9;border-radius:8px;overflow:hidden"><div class="bg-p" style="height:100%;width:${(byG[g]/mx)*100}%"></div></div><div style="width:40px;text-align:left;font-size:12px;font-weight:bold">${byG[g]}</div></div>`).join('')}</div></div>
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden"><table style="width:100%;font-size:14px"><thead style="background:#f8fafc;border-bottom:1px solid #e2e8f0"><tr style="text-align:right"><th style="padding:12px;font-weight:900;font-size:12px">التاريخ</th><th style="padding:12px;font-weight:900;font-size:12px">الطالب</th><th style="padding:12px;font-weight:900;font-size:12px">الصف/الشعبة</th><th style="padding:12px;font-weight:900;font-size:12px">السبب</th></tr></thead><tbody>${list.map(h=>`<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:12px;font-size:12px">${fmtD(h.createdAt)}</td><td style="padding:12px;font-weight:bold;font-size:12px">${esc(h.student.name)}</td><td style="padding:12px;font-size:12px">${h.student.grade}/${h.student.section}</td><td style="padding:12px;font-size:12px">${esc(h.reason||'—')}</td></tr>`).join('')}${list.length===0?'<tr><td colspan="4" style="text-align:center;padding:48px;color:#94a3b8">لا تحويلات</td></tr>':''}</tbody></table></div></div>`;
}
function pHR(){const list=DB.referrals.map(h=>({...h,student:gS(h.studentId)})).filter(h=>h.student);const rows=list.map(h=>`<tr><td style="border:1px solid #999;padding:6px;font-size:11px">${fmtD(h.createdAt)}</td><td style="border:1px solid #999;padding:6px;font-size:11px">${esc(h.student.name)}</td><td style="border:1px solid #999;padding:6px;font-size:11px;text-align:center">${h.student.grade}/${h.student.section}</td><td style="border:1px solid #999;padding:6px;font-size:11px">${esc(h.reason||'—')}</td></tr>`).join('');prt(`<div style="max-width:900px;margin:auto">${rHdr()}<div style="text-align:center;font-weight:900;font-size:14px;margin-bottom:12px">🌙 تقرير تحويلات الوحدة الصحية (${list.length}) 🌙</div><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:var(--c-primary);color:white"><th style="border:1px solid #999;padding:7px">التاريخ</th><th style="border:1px solid #999;padding:7px">الطالب</th><th style="border:1px solid #999;padding:7px">الصف/الشعبة</th><th style="border:1px solid #999;padding:7px">السبب</th></tr></thead><tbody>${rows}</tbody></table>${rFtr()}</div>`)}

/* ============ المستخدمون ============ */
function renderUsers(){return `<div class="space-y-4"><header style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px"><div><h1 style="font-size:24px;font-weight:900">👤 إدارة المستخدمين</h1><p style="font-size:13px;color:#64748b;margin-top:4px">${DB.users.length} مستخدم</p></div><button onclick="edU('')" class="bg-p text-white font-bold px-4 py-2.5 rounded-xl text-sm">+ إضافة</button></header>
  <div class="bg-blue-50 border-r-4 border-blue-500 p-4 rounded-xl text-sm"><b>💡 ملاحظة:</b> المستخدم بكلمة مرور فارغة يمكنه الدخول بكتابة اسم المستخدم فقط.</div>
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden"><table style="width:100%;font-size:14px"><thead style="background:#f8fafc;border-bottom:1px solid #e2e8f0"><tr style="text-align:right"><th style="padding:12px;font-weight:900;font-size:12px">الاسم</th><th style="padding:12px;font-weight:900;font-size:12px">المسمى</th><th style="padding:12px;font-weight:900;font-size:12px">المستخدم</th><th style="padding:12px;font-weight:900;font-size:12px">كلمة المرور</th><th style="padding:12px;font-weight:900;font-size:12px">الصلاحية</th><th style="padding:12px;font-weight:900;font-size:12px">إجراءات</th></tr></thead><tbody>${DB.users.map(u=>`<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:12px;font-weight:bold;font-size:12px">${esc(u.name)}</td><td style="padding:12px;font-size:12px"><span style="background:var(--s);color:var(--p);padding:4px 8px;border-radius:4px;font-weight:bold">${esc(u.title)}</span></td><td style="padding:12px;font-size:12px;font-family:monospace">${esc(u.username||'—')}</td><td style="padding:12px;font-size:12px">${u.password?'<span style="color:#dc2626">🔒 محمية</span>':'<span style="color:#059669">✓ بدون</span>'}</td><td style="padding:12px;font-size:12px">${u.isAdmin?'<span style="background:#fef3c7;color:#92400e;padding:4px 8px;border-radius:4px;font-weight:bold">👑 مدير</span>':'مستخدم'}</td><td style="padding:12px"><button onclick="edU('${u.id}')" style="padding:6px">✏️</button></td></tr>`).join('')}</tbody></table></div></div>`}
function edU(id){const u=id?gU(id):{name:'',title:'معلم',username:'',password:'',isAdmin:false};document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">${id?'تعديل':'إضافة'}</h3><div style="display:flex;flex-direction:column;gap:12px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الاسم *</label><input id="uN" value="${esc(u.name)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">المسمى *</label><input id="uT" value="${esc(u.title)}" list="titlesList" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"><datalist id="titlesList"><option value="معلم"><option value="مربي صف"><option value="أخصائي اجتماعي"><option value="وكيل"><option value="مدير"><option value="زائر صحي"></datalist></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">اسم المستخدم *</label><input id="uU" value="${esc(u.username||'')}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-mono" placeholder="مثال: ahmed"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">كلمة المرور <span class="text-slate-400">(اتركها فارغة للدخول بدون كلمة مرور)</span></label><input id="uP" value="${esc(u.password||'')}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-mono" placeholder="اتركها فارغة"></div><div><label style="display:flex;gap:8px;font-size:14px;background:#fffbeb;padding:12px;border-radius:12px"><input type="checkbox" id="uA" ${u.isAdmin?'checked':''}><span style="font-weight:bold">👑 صلاحيات مدير</span></label></div></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="svU('${id||''}')" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">حفظ</button>${id?`<button onclick="dlU('${id}')" class="px-4 bg-red-50 text-red-600 font-bold py-2.5 rounded-xl">حذف</button>`:''}<button onclick="this.closest('.mdl').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function svU(id){const n=document.getElementById('uN').value.trim();const t=document.getElementById('uT').value.trim();const un=document.getElementById('uU').value.trim();const p=document.getElementById('uP').value;const a=document.getElementById('uA').checked;if(!n||!t){toast('أكمل الاسم والمسمى','err');return}if(!un){toast('أدخل اسم المستخدم','err');return}if(DB.users.some(u=>u.username===un&&u.id!==id)){toast('اسم المستخدم محجوز','err');return}if(id){const u=gU(id);Object.assign(u,{name:n,title:t,username:un,password:p,isAdmin:a});if(u.id===USER.id)USER=u}else DB.users.push({id:uid0('U'),name:n,title:t,username:un,password:p,isAdmin:a});save();document.getElementById('mdl').innerHTML='';toast('✓');render()}
function dlU(id){const u=gU(id);if(u.isAdmin&&DB.users.filter(x=>x.isAdmin).length===1){toast('يجب وجود مدير','err');return}if(!confirm('حذف؟'))return;DB.users=DB.users.filter(x=>x.id!==id);save();document.getElementById('mdl').innerHTML='';render()}

/* ============ المخالفات ============ */
function renderBehaviors(){return `<div class="space-y-4"><header style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px"><div><h1 style="font-size:24px;font-weight:900">⚠️ إدارة المخالفات</h1><p style="font-size:13px;color:#64748b;margin-top:4px">${DB.behaviors.filter(b=>b.active).length} نشطة / ${DB.behaviors.length}</p></div><button onclick="edB('')" class="bg-p text-white font-bold px-4 py-2.5 rounded-xl text-sm">+ إضافة</button></header><div class="bg-white rounded-2xl shadow-sm overflow-hidden"><table style="width:100%;font-size:14px"><thead style="background:#f8fafc;border-bottom:1px solid #e2e8f0"><tr style="text-align:right"><th style="padding:12px;font-weight:900;font-size:12px">البند</th><th style="padding:12px;font-weight:900;font-size:12px">النقاط</th><th style="padding:12px;font-weight:900;font-size:12px">الحالة</th><th style="padding:12px;font-weight:900;font-size:12px">إجراءات</th></tr></thead><tbody>${DB.behaviors.map(b=>`<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:12px;font-weight:bold;font-size:12px">${esc(b.name)}</td><td style="padding:12px;font-size:12px"><span style="background:#fef2f2;color:#dc2626;padding:4px 8px;border-radius:4px;font-weight:bold">${b.points}</span></td><td style="padding:12px"><button onclick="tgB('${b.id}')" style="font-size:11px;font-weight:bold;padding:4px 8px;border-radius:4px;${b.active?'background:var(--s);color:var(--p)':'background:#f1f5f9;color:#64748b'}">${b.active?'✓ نشط':'معطل'}</button></td><td style="padding:12px"><button onclick="edB('${b.id}')" style="padding:6px">✏️</button><button onclick="dlB('${b.id}')" style="padding:6px">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`}
function edB(id){const b=id?gB(id):{name:'',points:1};document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">${id?'تعديل':'إضافة'}</h3><div style="display:flex;flex-direction:column;gap:12px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الاسم *</label><input id="bN" value="${esc(b.name)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">النقاط *</label><input id="bP" type="number" min="1" max="10" value="${b.points}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="svB('${id||''}')" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">حفظ</button>${id?`<button onclick="dlB('${id}')" class="px-4 bg-red-50 text-red-600 font-bold py-2.5 rounded-xl">حذف</button>`:''}<button onclick="this.closest('.mdl').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function svB(id){const n=document.getElementById('bN').value.trim();const p=+document.getElementById('bP').value;if(!n||!p){toast('أكمل','err');return}if(id){const b=gB(id);b.name=n;b.points=p}else DB.behaviors.push({id:uid0('B'),name:n,points:p,active:true});save();document.getElementById('mdl').innerHTML='';toast('✓');render()}
function tgB(id){const b=gB(id);b.active=!b.active;save();render()}
function dlB(id){if(!confirm('حذف؟'))return;DB.behaviors=DB.behaviors.filter(b=>b.id!==id);save();render()}

/* ============ الإجراءات ============ */
function renderActions(){return `<div class="space-y-4"><header style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px"><div><h1 style="font-size:24px;font-weight:900">🎯 إدارة الإجراءات</h1><p style="font-size:13px;color:#64748b;margin-top:4px">${DB.actions.length} إجراء</p></div><button onclick="edA('')" class="bg-p text-white font-bold px-4 py-2.5 rounded-xl text-sm">+ إضافة</button></header><div class="bg-white rounded-2xl shadow-sm overflow-hidden"><table style="width:100%;font-size:14px"><thead style="background:#f8fafc;border-bottom:1px solid #e2e8f0"><tr style="text-align:right"><th style="padding:12px;font-weight:900;font-size:12px">الإجراء</th><th style="padding:12px;font-weight:900;font-size:12px">الوصف</th><th style="padding:12px;font-weight:900;font-size:12px">إجراءات</th></tr></thead><tbody>${DB.actions.map(a=>`<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:12px;font-weight:bold;font-size:12px">${esc(a.name)}</td><td style="padding:12px;font-size:12px;color:#64748b">${esc(a.desc||'—')}</td><td style="padding:12px"><button onclick="edA('${a.id}')" style="padding:6px">✏️</button><button onclick="dlA('${a.id}')" style="padding:6px">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`}
function edA(id){const a=id?gA(id):{name:'',desc:''};document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">${id?'تعديل':'إضافة'}</h3><div style="display:flex;flex-direction:column;gap:12px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الاسم *</label><input id="aN" value="${esc(a.name)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الوصف</label><textarea id="aD" rows="3" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm">${esc(a.desc||'')}</textarea></div></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="svA('${id||''}')" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">حفظ</button>${id?`<button onclick="dlA('${id}')" class="px-4 bg-red-50 text-red-600 font-bold py-2.5 rounded-xl">حذف</button>`:''}<button onclick="this.closest('.mdl').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function svA(id){const n=document.getElementById('aN').value.trim();const d=document.getElementById('aD').value.trim();if(!n){toast('أدخل الاسم','err');return}if(id){const a=gA(id);a.name=n;a.desc=d}else DB.actions.push({id:uid0('A'),name:n,desc:d});save();document.getElementById('mdl').innerHTML='';toast('✓');render()}
function dlA(id){if(!confirm('حذف؟'))return;DB.actions=DB.actions.filter(a=>a.id!==id);save();render()}

/* ============ التقارير ============ */
function renderReports(){return `<div class="space-y-5"><header><h1 style="font-size:24px;font-weight:900">📄 التقارير الرسمية</h1><p style="font-size:13px;color:#64748b;margin-top:4px">📅 ${today()}</p></header><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${rc('rptStu()','👤','تقرير طالب','سجل كامل')}${rc('rptGrade()','🏫','تقرير صف','كشف الطلبة')}${rc('pRecs()','📋','كشف المخالفات','حسب الفلاتر')}${rc('cardsStu()','📇','كشف طلبة','أسماء وأرقام')}${rc('go(\'hreport\')','📊','تقرير الوحدة الصحية','🌙 إحصائية')}</div></div>`}
function rc(a,i,t,d){return `<button onclick="${a}" class="card bg-white rounded-2xl p-5 shadow-sm text-right"><div class="ic w-12 h-12 bg-ps text-p text-2xl mb-2">${i}</div><div style="font-weight:900">${t}</div><div style="font-size:12px;color:#64748b;margin-top:4px">${d}</div></button>`}
let RP='';
function rptStu(){RP='';document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">تقرير طالب</h3><div style="position:relative;margin-bottom:12px"><input id="rS" placeholder="ابحث..." oninput="sRS()" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"><div id="rD" class="dd hidden"></div></div><div id="rP"></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="pRS()" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">🖨️ طباعة</button><button onclick="waRS()" class="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl">💬 واتساب</button><button onclick="this.closest('.mdl').remove()" class="px-3 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function sRS(){const q=document.getElementById('rS').value.trim();const d=document.getElementById('rD');const list=DB.students.filter(s=>!q||s.name.includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ar')).slice(0,20);if(!list.length){d.innerHTML='<div style="padding:12px;text-align:center;color:#94a3b8;font-size:13px">لا نتائج</div>';d.classList.remove('hidden');return}d.innerHTML=list.map(s=>`<div class="ddi" onclick="pkRS('${s.id}')"><div><div style="font-size:14px;font-weight:bold">${esc(s.name)}</div><div style="font-size:12px;color:#64748b">صف ${s.grade} · شعبة ${s.section}</div></div></div>`).join('');d.classList.remove('hidden')}
function pkRS(sid){RP=sid;const s=gS(sid);document.getElementById('rS').value=s.name;document.getElementById('rD').classList.add('hidden');document.getElementById('rD').innerHTML='';document.getElementById('rP').innerHTML=`<div style="padding:8px;background:var(--s);border-radius:8px;font-size:12px;font-weight:bold">✓ ${esc(s.name)}</div>`}
function stuReportHTML(sid){const s=gS(sid);const recs=DB.records.filter(r=>r.studentId===sid).sort((a,b)=>b.createdAt-a.createdAt);const tp=recs.reduce((a,r)=>a+(r.points||0),0);const rows=recs.map(r=>`<tr><td style="border:1px solid #999;padding:5px;font-size:10px">${fmtD(r.createdAt)}</td><td style="border:1px solid #999;padding:5px;font-size:10px">${esc(r.behaviorName||'')}</td><td style="border:1px solid #999;padding:5px;font-size:10px;text-align:center;color:#DC2626;font-weight:bold">${r.points||0}</td><td style="border:1px solid #999;padding:5px;font-size:10px">${esc(r.actionName||'')}</td></tr>`).join('');return `<div style="max-width:900px;margin:auto">${rHdr()}<div style="text-align:center;font-size:15px;font-weight:900;margin-bottom:12px;background:var(--c-primary-soft);padding:8px;border-radius:6px">تقرير السلوك الشامل</div><table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px"><tr><td style="border:1px solid #999;padding:7px;background:#f5f5f5;font-weight:bold;width:20%">الطالب</td><td style="border:1px solid #999;padding:7px">${esc(s.name)}</td><td style="border:1px solid #999;padding:7px;background:#f5f5f5;font-weight:bold;width:15%">الصف</td><td style="border:1px solid #999;padding:7px">${s.grade}/${s.section}</td></tr><tr><td style="border:1px solid #999;padding:7px;background:#f5f5f5;font-weight:bold">المخالفات</td><td style="border:1px solid #999;padding:7px;font-weight:bold;color:#DC2626">${recs.length}</td><td style="border:1px solid #999;padding:7px;background:#f5f5f5;font-weight:bold">النقاط</td><td style="border:1px solid #999;padding:7px;font-weight:bold;color:#DC2626">${tp}</td></tr></table><table style="width:100%;border-collapse:collapse;font-size:10px"><thead><tr style="background:var(--c-primary);color:white"><th style="border:1px solid #999;padding:6px">التاريخ</th><th style="border:1px solid #999;padding:6px">المخالفة</th><th style="border:1px solid #999;padding:6px">النقاط</th><th style="border:1px solid #999;padding:6px">الإجراء</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="border:1px solid #999;padding:15px;text-align:center">لا مخالفات</td></tr>'}</tbody></table>${rFtr()}</div>`}
function pRS(){if(!RP){toast('اختر','err');return}document.getElementById('mdl').innerHTML='';prt(stuReportHTML(RP))}
function waRS(){if(!RP){toast('اختر','err');return}const s=gS(RP);if(!s.phone){toast('لا رقم','err');return}const recs=DB.records.filter(r=>r.studentId===RP);const tp=recs.reduce((a,r)=>a+(r.points||0),0);let msg=`السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب: ${s.name}\nالصف: ${s.grade} / الشعبة: ${s.section}\n\n📋 تقرير السلوك:\nإجمالي المخالفات: ${recs.length}\nإجمالي النقاط: ${tp}\n\n${DB.config.schoolName}`;wa(s.phone,msg)}
function rptGrade(){document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">تقرير صف</h3><div style="display:flex;flex-direction:column;gap:12px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الصف</label><select id="gG" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white">${GR.map(g=>`<option>${g}</option>`).join('')}</select></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الشعبة</label><select id="gS2" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white"><option value="">كل الشعب</option>${SC.map(s=>`<option>${s}</option>`).join('')}</select></div></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="doGR()" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">🖨️ طباعة</button><button onclick="this.closest('.mdl').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function doGR(){const g=+document.getElementById('gG').value;const s=document.getElementById('gS2').value;const stus=DB.students.filter(x=>x.grade===g&&(!s||x.section===+s)).sort((a,b)=>a.section-b.section||a.name.localeCompare(b.name,'ar'));const rows=stus.map((x,i)=>{const st=stats(x.id);return `<tr><td style="border:1px solid #999;padding:5px;text-align:center;font-size:10px">${i+1}</td><td style="border:1px solid #999;padding:5px;font-size:10px">${esc(x.name)}</td><td style="border:1px solid #999;padding:5px;text-align:center;font-size:10px">${x.section}</td><td style="border:1px solid #999;padding:5px;text-align:center;font-size:10px;color:#DC2626;font-weight:bold">${st.count}</td><td style="border:1px solid #999;padding:5px;text-align:center;font-size:10px;color:#DC2626;font-weight:bold">${st.points}</td></tr>`}).join('');document.getElementById('mdl').innerHTML='';prt(`<div style="max-width:900px;margin:auto">${rHdr()}<div style="text-align:center;font-size:14px;font-weight:900;margin-bottom:12px;background:var(--c-primary-soft);padding:8px;border-radius:6px">كشف السلوك — الصف ${g} ${s?'شعبة '+s:''}</div><table style="width:100%;border-collapse:collapse;font-size:10px"><thead><tr style="background:var(--c-primary);color:white"><th style="border:1px solid #999;padding:6px">#</th><th style="border:1px solid #999;padding:6px">الاسم</th><th style="border:1px solid #999;padding:6px">الشعبة</th><th style="border:1px solid #999;padding:6px">المخالفات</th><th style="border:1px solid #999;padding:6px">النقاط</th></tr></thead><tbody>${rows}</tbody></table>${rFtr()}</div>`)}
function cardsStu(){document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">كشف طلبة</h3><div style="display:flex;flex-direction:column;gap:12px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الصف</label><select id="cG" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white">${GR.map(g=>`<option>${g}</option>`).join('')}</select></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">الشعبة</label><select id="cS" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white"><option value="">كل الشعب</option>${SC.map(s=>`<option>${s}</option>`).join('')}</select></div></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="doCards()" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">🖨️ طباعة</button><button onclick="this.closest('.mdl').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function doCards(){const g=+document.getElementById('cG').value;const s=document.getElementById('cS').value;const stus=DB.students.filter(x=>x.grade===g&&(!s||x.section===+s)).sort((a,b)=>a.section-b.section||a.name.localeCompare(b.name,'ar'));const rows=stus.map((x,i)=>`<tr><td style="border:1px solid #999;padding:5px;text-align:center;font-size:10px">${i+1}</td><td style="border:1px solid #999;padding:5px;font-size:10px">${esc(x.name)}</td><td style="border:1px solid #999;padding:5px;text-align:center;font-size:10px">${x.section}</td><td style="border:1px solid #999;padding:5px;text-align:center;font-size:10px">${x.phone?esc(x.phone):'—'}</td></tr>`).join('');document.getElementById('mdl').innerHTML='';prt(`<div style="max-width:900px;margin:auto">${rHdr()}<div style="text-align:center;font-weight:900;font-size:14px;margin-bottom:12px">كشف طلبة الصف ${g} ${s?'شعبة '+s:''} (${stus.length})</div><table style="width:100%;border-collapse:collapse;font-size:10px"><thead><tr style="background:var(--c-primary);color:white"><th style="border:1px solid #999;padding:6px;width:40px">#</th><th style="border:1px solid #999;padding:6px">الاسم</th><th style="border:1px solid #999;padding:6px;width:70px">الشعبة</th><th style="border:1px solid #999;padding:6px;width:110px">هاتف ولي الأمر</th></tr></thead><tbody>${rows}</tbody></table>${rFtr()}</div>`)}

/* ============ التنبيهات ============ */
function renderAlerts(){
  const al=alerts(),fu=follow();
  return `<div class="space-y-5"><header><h1 style="font-size:24px;font-weight:900">🔔 التنبيهات والمتابعة</h1><p style="font-size:13px;color:#64748b;margin-top:4px">${al.length} تنبيه · ${fu.length} متابعة</p></header>
  <div><h2 style="font-weight:900;padding-right:12px;border-right:4px solid #f59e0b;margin-bottom:12px;color:#92400e">⏰ متابعات أولياء الأمور (${fu.length})</h2>
  ${fu.length===0?`<div class="bg-white rounded-2xl p-8 text-center shadow-sm"><div style="font-size:32px">✅</div><div style="font-weight:bold;color:var(--p);margin-top:8px">لا متابعات معلقة</div></div>`:`<div style="display:flex;flex-direction:column;gap:12px">${fu.map(f=>{const s=f.s,r=f.r;return `<div class="bg-white rounded-2xl p-4 shadow-sm" style="border-right:4px solid #f59e0b"><div style="display:flex;gap:12px;align-items:start;flex-wrap:wrap"><div style="width:44px;height:44px;border-radius:12px;background:#fef3c7;display:flex;align-items:center;justify-content:center;font-size:24px">⏰</div><div style="flex:1;min-width:200px"><div style="font-weight:900;font-size:14px">${esc(s.name)}</div><div style="font-size:12px;color:#64748b;margin-top:4px">صف ${s.grade} / شعبة ${s.section}</div><div style="font-size:12px;color:#64748b;margin-top:4px">📋 ${esc(r?.behaviorName||'')} → ${esc(r?.actionName||'')}</div><div style="font-size:10px;color:#92400e;font-weight:bold;margin-top:4px">منذ ${f.d} يوم</div></div></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button onclick="fuU('${f.id}','yes')" class="flex-1 bg-emerald-600 text-white font-bold py-2 rounded-lg text-xs">✓ حضر</button><button onclick="fuU('${f.id}','no')" class="flex-1 bg-red-600 text-white font-bold py-2 rounded-lg text-xs">✗ لم يحضر</button><button onclick="fuU('${f.id}','note')" class="flex-1 bg-slate-600 text-white font-bold py-2 rounded-lg text-xs">📝 ملاحظة</button></div></div>`}).join('')}</div>`}</div>
  <div><h2 style="font-weight:900;padding-right:12px;border-right:4px solid #dc2626;margin-bottom:12px;color:#991b1b">🚨 تكرار المخالفات (${al.length})</h2>
  ${al.length===0?`<div class="bg-white rounded-2xl p-8 text-center shadow-sm"><div style="font-size:32px">✅</div><div style="font-weight:bold;color:var(--p);margin-top:8px">لا تنبيهات</div></div>`:al.map(a=>`<div class="bg-white rounded-2xl p-5 shadow-sm" style="border-right:4px solid ${a.sev==='h'?'#dc2626':'#f59e0b'}"><div style="display:flex;gap:12px;align-items:start"><div style="width:44px;height:44px;border-radius:12px;background:${a.sev==='h'?'#fee2e2':'#fef3c7'};display:flex;align-items:center;justify-content:center;font-size:24px">${a.sev==='h'?'🚨':'⚠️'}</div><div style="flex:1"><div style="font-weight:900">${esc(a.title)}</div><p style="font-size:14px;color:#475569;margin-top:4px">${esc(a.msg)}</p></div><button onclick="DB.resolved.push('${a.id}');save();render()" class="bg-p text-white text-xs font-bold px-3 py-2 rounded-lg">✓</button></div></div>`).join('')}</div></div>`;
}
function fuU(id,st){document.getElementById('mdl').innerHTML=`<div class="mdl" onclick="if(event.target===this)this.remove()"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 style="font-weight:900;font-size:18px;margin-bottom:16px">${st==='yes'?'✓ حضر':st==='no'?'✗ لم يحضر':'📝 ملاحظة'}</h3><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">ملاحظات</label><textarea id="fuN" rows="3" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></textarea></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="doFu('${id}','${st}')" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">حفظ</button><button onclick="this.closest('.mdl').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button></div></div></div>`}
function doFu(id,st){const n=document.getElementById('fuN').value.trim();if(st==='note'&&!n){toast('اكتب ملاحظة','err');return}const f=DB.followups.find(x=>x.id===id);if(st==='note'){f.note=n}else{f.status=st;f.note=n;f.resolved=true;f.resolvedAt=Date.now()}save();document.getElementById('mdl').innerHTML='';toast('✓');render()}

/* ============ الإعدادات ============ */
function renderSettings(){
  const c=DB.config;
  return `<div class="space-y-5 max-w-4xl"><header><h1 style="font-size:24px;font-weight:900">⚙️ الإعدادات</h1><p style="font-size:13px;color:#64748b;margin-top:4px">للمدير فقط</p></header>
  <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4"><h3 style="font-weight:900;padding-right:12px;border-right:4px solid var(--p);margin-bottom:16px">🎨 المظهر</h3><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:8px">لون المنصة</label><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">${Object.entries(TH).map(([k,t])=>`<button onclick="DB.config.theme='${k}';save();theme();render()" style="padding:12px;border-radius:12px;border:2px solid ${c.theme===k?'#1e293b':'#e2e8f0'}"><div style="width:100%;height:26px;border-radius:8px;background:${t[0]};margin-bottom:6px"></div><div style="font-size:10px;font-weight:bold">${t[5]}</div></button>`).join('')}</div></div><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:8px">حجم الواجهة</label><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${[['small','صغير'],['medium','متوسط'],['large','كبير'],['xl','كبير جداً']].map(([v,l])=>`<button onclick="DB.config.uiSize='${v}';save();size();render()" style="padding:12px;border-radius:12px;border:2px solid ${c.uiSize===v?'var(--p)':'#e2e8f0'};background:${c.uiSize===v?'var(--s)':'#fff'};font-weight:bold;font-size:12px">${l}</button>`).join('')}</div></div></div>
  <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4"><h3 style="font-weight:900;padding-right:12px;border-right:4px solid var(--p);margin-bottom:16px">🖨️ الطباعة</h3><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:8px">خط الطباعة</label><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${['Cairo','Tajawal','Almarai','Amiri','Noto Kufi Arabic'].map(f=>`<button onclick="DB.config.printFont='${f}';save();render()" style="padding:12px;border-radius:12px;border:2px solid ${c.printFont===f?'var(--p)':'#e2e8f0'};background:${c.printFont===f?'var(--s)':'#fff'};font-family:'${f}',sans-serif;font-size:14px;font-weight:bold">${f}</button>`).join('')}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:4px">حجم الخط</label><select onchange="DB.config.printSize=this.value;save();render()" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white">${[10,11,12,13,14,15,16,18].map(n=>`<option ${c.printSize==n?'selected':''}>${n}</option>`).join('')}</select></div><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:4px">السماكة</label><select onchange="DB.config.printWeight=this.value;save();render()" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white"><option value="400" ${c.printWeight=='400'?'selected':''}>عادي</option><option value="600" ${c.printWeight=='600'?'selected':''}>شبه عريض</option><option value="700" ${c.printWeight=='700'?'selected':''}>عريض</option><option value="900" ${c.printWeight=='900'?'selected':''}>عريض جداً</option></select></div></div></div>
  <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4"><h3 style="font-weight:900;padding-right:12px;border-right:4px solid var(--p);margin-bottom:16px">🏫 الهوية</h3><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:4px">اسم المنصة</label><input id="sP" value="${esc(c.platformName)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:4px">اسم المدرسة</label><input id="sS" value="${esc(c.schoolName)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:4px">السطر الوزاري</label><input id="sM" value="${esc(c.ministry)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:4px">المديرية</label><input id="sD" value="${esc(c.directorate)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:4px">الشعار الأيمن</label><input type="file" id="sLR" accept="image/*" class="text-sm">${c.logoR?`<div style="margin-top:8px;display:flex;gap:8px;align-items:center"><img src="${c.logoR}" style="width:50px;height:50px;object-fit:contain;border-radius:8px;border:1px solid #e2e8f0"><button onclick="DB.config.logoR='';save();render()" style="font-size:12px;color:#dc2626;font-weight:bold">حذف</button></div>`:''}</div><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:4px">الشعار الأيسر</label><input type="file" id="sLL" accept="image/*" class="text-sm">${c.logoL?`<div style="margin-top:8px;display:flex;gap:8px;align-items:center"><img src="${c.logoL}" style="width:50px;height:50px;object-fit:contain;border-radius:8px;border:1px solid #e2e8f0"><button onclick="DB.config.logoL='';save();render()" style="font-size:12px;color:#dc2626;font-weight:bold">حذف</button></div>`:''}</div></div></div>
  <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4"><h3 style="font-weight:900;padding-right:12px;border-right:4px solid var(--p);margin-bottom:16px">📋 تذييل الطباعة</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">نص اللجنة</label><input id="sC" value="${esc(c.committee)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">القسم الإداري</label><input id="sAD" value="${esc(c.adminDept)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">مسمى المدير</label><input id="sPT" value="${esc(c.principalTitle)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">اسم المدير</label><input id="sPN" value="${esc(c.principalName)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">مسمى الزائر الصحي</label><input id="sHVT" value="${esc(c.healthVisitorTitle)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div><div><label style="display:block;font-size:12px;font-weight:bold;margin-bottom:4px">اسم الزائر الصحي</label><input id="sHVN" value="${esc(c.healthVisitorName)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div></div></div>
  <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4"><h3 style="font-weight:900;padding-right:12px;border-right:4px solid var(--p);margin-bottom:16px">💬 قوالب واتساب</h3><div style="background:#eff6ff;border-right:4px solid #3b82f6;padding:12px;border-radius:12px;font-size:12px">المتغيرات: <code>{student}</code> <code>{grade}</code> <code>{section}</code> <code>{behavior}</code> <code>{points}</code> <code>{action}</code> <code>{date}</code> <code>{school}</code> <code>{reason}</code></div><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:4px">قالب رسالة المخالفة</label><textarea id="sWB" rows="8" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-xs font-mono">${esc(c.waBehavior)}</textarea></div><div><label style="display:block;font-size:14px;font-weight:bold;margin-bottom:4px">قالب رسالة التحويل الصحي</label><textarea id="sWH" rows="8" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-xs font-mono">${esc(c.waHealth)}</textarea></div></div>
  <button onclick="svSet()" class="w-full bg-p text-white font-black py-3.5 rounded-xl shadow">💾 حفظ الإعدادات</button>
  <div class="bg-white rounded-2xl p-6 shadow-sm space-y-3"><h3 style="font-weight:900;color:#dc2626">⚠️ إجراءات متقدمة</h3><div style="display:flex;flex-wrap:wrap;gap:8px"><button onclick="bk()" class="bg-p text-white font-bold px-4 py-2 rounded-xl text-sm">💾 نسخة احتياطية</button><button onclick="restore()" class="bg-white border-2 border-slate-200 font-bold px-4 py-2 rounded-xl text-sm">📤 استيراد</button><button onclick="if(confirm('حذف كل البيانات؟')){localStorage.clear();location.reload()}" class="bg-red-50 text-red-600 font-bold px-4 py-2 rounded-xl text-sm">🗑️ إعادة تعيين</button></div></div></div>`;
}
function svSet(){
  const g=id=>document.getElementById(id)?.value||'';
  DB.config.platformName=g('sP');DB.config.schoolName=g('sS');DB.config.ministry=g('sM');DB.config.directorate=g('sD');
  DB.config.committee=g('sC');DB.config.adminDept=g('sAD');DB.config.principalTitle=g('sPT');DB.config.principalName=g('sPN');
  DB.config.healthVisitorTitle=g('sHVT');DB.config.healthVisitorName=g('sHVN');
  DB.config.waBehavior=g('sWB');DB.config.waHealth=g('sWH');
  const fr=document.getElementById('sLR').files[0],fl=document.getElementById('sLL').files[0];
  let p=0;const done=()=>{if(p===0){save();nav();toast('✓ تم');render()}};
  if(fr){p++;const r=new FileReader();r.onload=e=>{DB.config.logoR=e.target.result;p--;done()};r.readAsDataURL(fr)}
  if(fl){p++;const r=new FileReader();r.onload=e=>{DB.config.logoL=e.target.result;p--;done()};r.readAsDataURL(fl)}
  if(p===0)done();
}

/* ============ Render ============ */
function render(){
  const el=document.getElementById('ct');
  if(!el)return;
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={};
  const m={home:renderHome,entry:renderEntry,records:renderRecords,analytics:renderAnalytics,students:renderStudents,health:renderHealth,htrans:renderHealthTransfer,hreport:renderHealthReport,users:renderUsers,behaviors:renderBehaviors,actions:renderActions,reports:renderReports,alerts:renderAlerts,settings:renderSettings};
  try{el.innerHTML=(m[pg]||renderHome)()}catch(e){console.error('render:',e);el.innerHTML='<div class="bg-white rounded-2xl p-8 text-center"><div style="font-size:48px;margin-bottom:12px">⚠️</div><div style="font-weight:900;color:#dc2626">حدث خطأ في التحميل</div><div style="font-size:12px;color:#64748b;margin-top:8px">'+e.message+'</div></div>'}
  if(pg==='entry')updE();
  if(pg==='analytics')setTimeout(drawCharts,100);
}

/* ============ بدء ============ */
async function boot(){
  nav();
  go('home');
  setTimeout(async ()=>{
    if(!CLOUD.enabled){upCloud('📴 محلي');return}
    upCloud('⬇️ تحميل...');
    const ok=await cloudPull(false);
    if(ok){render();upCloud('✅ متزامن')}
    else{upCloud('✅ جاهز')}
    setInterval(async()=>{
      if(!CLOUD.syncing&&navigator.onLine){
        await cloudPull(true);
        render();
      }
    },15000);
  },500);
  setInterval(()=>{
    const e=document.getElementById('bkSt');
    if(!e)return;
    const m=BK.last?Math.floor((Date.now()-BK.last)/60000):null;
    e.textContent=(BK.enabled?'🟢':'⏸️')+' '+(m===null?'—':m<1?'الآن':'قبل '+m+'د')+' · '+BK.n+'/'+BK.int;
  },10000);
}
const sess=sessionStorage.getItem('alm_sess');
if(sess){const u=DB.users.find(x=>x.id===sess);if(u){USER=u;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('usr').textContent=u.name;boot()}}
</script>
</body>
