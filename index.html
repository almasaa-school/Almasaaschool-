      DB.users = Array.isArray(DB.users) ? DB.users : defaultDB.users;
      DB.healthReferrals = Array.isArray(DB.healthReferrals) ? DB.healthReferrals : [];
      DB.alerts = Array.isArray(DB.alerts) ? DB.alerts : [];
      DB.settings = Object.assign({}, defaultDB.settings, DB.settings || {});
    }catch(e){
      DB = defaultDB;
    }
  }else{
    DB = defaultDB;
  }
  saveDB();
}

function saveDB(){
  lastLocalSave=Date.now();
  localStorage.setItem('almasaa_v17',JSON.stringify(DB));
  if(CLOUD.enabled&&navigator.onLine) cloudPush();
}

async function cloudPush(){
  if(!sbClient) return;
  if(CLOUD.syncing){ CLOUD.pendingPush=true; return; }
  CLOUD.syncing=true;
  try{ await sbClient.from('app_data').upsert({id:'main',payload:DB,updated_at:new Date().toISOString()}); }
  catch(e){ console.warn('cloudPush',e); }
  CLOUD.syncing=false;
  if(CLOUD.pendingPush){ CLOUD.pendingPush=false; cloudPush(); }
}

async function cloudPull(silent=true){
  if(!sbClient||CLOUD.syncing||!navigator.onLine) return;
  if(Date.now()-lastLocalSave<3000){ return; }
  try{
    CLOUD.syncing=true;
    const {data}=await sbClient.from('app_data').select('payload').eq('id','main').single();
    if(data&&data.payload&&data.payload.students){
      const incoming=JSON.stringify(data.payload), current=JSON.stringify(DB);
      if(incoming!==current){
        DB=data.payload;
        if(!DB.records) DB.records=[];
        localStorage.setItem('almasaa_v17',JSON.stringify(DB));
        if(!formDirty&&!document.getElementById('appScreen').classList.contains('hidden')){
          renderPage(currentPage);
        }
        if(!silent) showToast('تمت المزامنة ✓');
      }
    }
  }catch(e){ console.warn('cloudPull',e); }
  CLOUD.syncing=false;
}

function manualSync(){
  const b=document.getElementById('syncBtn');
  const old=b.textContent;
  b.textContent='⏳ جارٍ المزامنة...'; b.disabled=true;
  cloudPush().then(()=>{ lastLocalSave=0; return cloudPull(false); }).finally(()=>{ b.textContent=old; b.disabled=false; });
}

/* ============================================================
   3) محرك التدرج السلوكي
============================================================ */
function getEscalation(behavior){
  if(behavior&&Array.isArray(behavior.escalation)&&behavior.escalation.length) return behavior.escalation;
  const map={1:['A1','A2','A3','A4','A5'],2:['A2','A3','A4','A5','A6'],3:['A3','A4','A5','A6','A8'],4:['A4','A5','A6','A8','A11'],5:['A5','A6','A8','A11'],6:['A8','A11']};
  return map[behavior.level]||map[1];
}

function getEscalationState(studentId,behaviorId){
  const behavior=DB.behaviors.find(b=>b.id===behaviorId);
  if(!behavior) return null;
  const esc=getEscalation(behavior);
  const pastCount=DB.records.filter(r=>r.studentId===studentId&&r.behaviorId===behaviorId).length;
  const stepIdx=Math.min(pastCount,esc.length-1);
  return {behavior,esc,pastCount,stepIdx,suggestedActionId:esc[stepIdx]};
}

function getAtRiskStudents(){
  const out=[];
  DB.students.forEach(s=>{
    DB.behaviors.forEach(b=>{
      if(b.id==='B_OTHER') return;
      const st=getEscalationState(s.id,b.id);
      if(st&&st.pastCount>=st.esc.length-1){
        const lastAct=DB.actions.find(a=>a.id===st.esc[st.esc.length-1]);
        out.push({student:s,behavior:b,count:st.pastCount,total:st.esc.length,lastAction:lastAct});
      }
    });
  });
  return out;
}

    const err=document.getElementById('loginErr');

    setTimeout(()=>err.classList.add('hidden'),3000);
  }
}

function onEntryChange(){
  const sid=document.getElementById('selStudent').value;
  const bid=document.getElementById('selBehavior').value;
  formDirty=!!(sid||bid);
  document.getElementById('customBox').classList.toggle('hidden',bid!=='B_OTHER');
  const preview=document.getElementById('escalationPreview');
  if(!sid||!bid){preview.classList.add('hidden');updateRegBox();return;}
  const state=getEscalationState(sid,bid);
  if(!state){preview.classList.add('hidden');return;}
  const student=DB.students.find(x=>x.id===sid);
  const {behavior,esc,pastCount,stepIdx,suggestedActionId}=state;
  document.getElementById('selAction').value=suggestedActionId;
  const chain=esc.map((aid,i)=>{
    const a=DB.actions.find(x=>x.id===aid) || {name:'غير معروف'};
    const isPast=i<stepIdx, isCur=i===stepIdx;
    const cls=isCur?'bg-emerald-600 text-white font-bold shadow':(isPast?'bg-emerald-100 text-emerald-700 line-through':'bg-slate-200 text-slate-500');
    return `<span class="inline-block px-2 py-1 rounded text-xs ${cls}">${isPast?'✓':isCur?'▶':'○'} ${a.name}</span>`;
  }).join('<span class="text-slate-400 text-xs mx-1">←</span>');
  const cur=DB.actions.find(a=>a.id===suggestedActionId);
  preview.classList.remove('hidden');
  preview.innerHTML=`
    <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
      <h4 class="font-black text-emerald-800 text-sm">📊 التسلسل التصاعدي لهذا السلوك</h4>
      <span class="text-xs bg-emerald-700 text-white px-2 py-1 rounded-full font-bold">التكرار ${pastCount+1} — الخطوة ${stepIdx+1} من ${esc.length}</span>
    </div>
    <div class="flex flex-wrap items-center gap-1 mb-3">${chain}</div>
    <div class="text-xs bg-white rounded-lg p-3 border border-emerald-200">
      <div><strong>الطالب:</strong> ${student.name} — صف ${student.grade}/${student.section}</div>
      <div class="mt-1"><strong>عدد التكرارات السابقة:</strong> ${pastCount}</div>
      <div class="mt-1 text-emerald-800 font-bold">▶ الإجراء المقترح: ${cur.name}</div>
    </div>`;
  updateRegBox();
}

function updateRegBox(){
  const actId=document.getElementById('selAction')?.value;
  const act=DB.actions.find(a=>a.id===actId);
  const box=document.getElementById('regBox'), text=document.getElementById('regText');
  if(!box||!text) return;
  if(act&&act.desc){box.classList.remove('hidden');text.textContent=act.desc;} else box.classList.add('hidden');
}

function saveRecord(){
  const sid=document.getElementById('selStudent').value;
  const bid=document.getElementById('selBehavior').value;
  const aid=document.getElementById('selAction').value;
  const customName=document.getElementById('customName')?.value.trim()||'';
  const metWith=document.getElementById('metWith').value.trim();
  const teacher=document.getElementById('teacher').value.trim();
  const notes=document.getElementById('notes').value.trim();
  if(!sid||!bid) return showToast('⚠️ يرجى اختيار الطالب والسلوك','error');
  if(bid==='B_OTHER'&&!customName) return showToast('⚠️ يرجى كتابة وصف السلوك','error');
  
  const behavior=DB.behaviors.find(x=>x.id===bid);
  const action=DB.actions.find(x=>x.id===aid);
  if(!action) return showToast('⚠️ الإجراء غير صحيح','error');
  
  const state=getEscalationState(sid,bid);
  const record={
    id:'R'+Date.now()+Math.floor(Math.random()*1000),
    studentId:sid, behaviorId:bid,
    behaviorName:customName||behavior.name,
    customBehaviorName:customName||'',
    actionId:aid, actionName:action.name,
    regulationText:action.desc,
    points:behavior.points || 1,
    escalationPath:state.esc.slice(),
    escalationStep:state.stepIdx+1,
    escalationTotal:state.esc.length,
    metWith, teacher, notes,
    createdAt:Date.now()
  };
  DB.records.push(record);
  saveDB(); formDirty=false;
  showToast(`✅ تم التسجيل (خطوة ${record.escalationStep} من ${record.escalationTotal})`);
  renderPage('records');
}

function applyRecordsFilters(){
  const q=(document.getElementById('filterSearch')?.value||'').trim().toLowerCase();
  const grade=document.getElementById('filterGrade')?.value||'';
  const cat=document.getElementById('filterCat')?.value||'';
  const month=document.getElementById('filterMonth')?.value||'';
  
  const filtered=DB.records.slice().reverse().filter(r=>{
    const s=DB.students.find(x=>x.id===r.studentId)||{};
    if(q && !(s.name||'').toLowerCase().includes(q)) return false;
    if(grade && String(s.grade)!==grade) return false;
    const b=DB.behaviors.find(x=>x.id===r.behaviorId);
    if(cat && b && b.cat!==cat) return false;
    if(month){
      const d=new Date(r.createdAt);
      const m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if(m!==month) return false;
    }
    return true;
  });
  
  const body=document.getElementById('recordsBody');
  const count=document.getElementById('recordsCount');
  if(!body) return;
  
  body.innerHTML=filtered.length?filtered.map(r=>{
    const s=DB.students.find(x=>x.id===r.studentId)||{name:'—',grade:'—',section:'—'};
    const stepInfo=r.escalationStep?`${r.escalationStep}/${r.escalationTotal}`:'—';
    return `<tr class="border-b hover:bg-slate-50">
      <td class="p-3 text-xs whitespace-nowrap">${new Date(r.createdAt).toLocaleDateString('ar-OM')}</td>
      <td class="p-3 font-bold text-sm">${s.name}</td>
      <td class="p-3 text-xs whitespace-nowrap">${s.grade}/${s.section}</td>
      <td class="p-3 text-red-600 text-xs">${r.behaviorName}</td>
      <td class="p-3 text-emerald-700 text-xs">${r.actionName}</td>
      <td class="p-3 text-xs text-center"><span class="bg-amber-100 text-amber-800 px-2 py-1 rounded-full font-bold">${stepInfo}</span></td>
      <td class="p-3 text-xs no-print whitespace-nowrap">
        <button onclick="openPrintModal('${r.id}')" class="text-blue-600 hover:text-blue-800 ml-2" title="طباعة">🖨️</button>
        <button onclick="deleteRecord('${r.id}')" class="text-red-500 hover:text-red-700" title="حذف">🗑️</button>
      </td>
    </tr>`;
  }).join(''):'<tr><td colspan="7" class="p-8 text-center text-slate-400">لا توجد سجلات مطابقة</td></tr>';
  
  if(count) count.textContent=`عرض ${filtered.length} من ${DB.records.length} سجل`;
}

function deleteRecord(id){
  if(!confirm('حذف هذا السجل نهائياً؟')) return;
  DB.records=DB.records.filter(r=>r.id!==id);
  saveDB(); showToast('تم الحذف'); renderPage(currentPage);
}

   8) التحليل المتقدم (الرسوم البيانية)

function renderAnalysis(main){
  main.innerHTML = `
    <h2 class="text-2xl font-black mb-6">التحليل المتقدم</h2>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="font-bold text-emerald-800 mb-4">المخالفات حسب الصف</h3>
        <div style="height:300px"><canvas id="chartGrade"></canvas></div>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="font-bold text-emerald-800 mb-4">التوزيع حسب التصنيف</h3>
        <div style="height:300px"><canvas id="chartCat"></canvas></div>
      </div>
    </div>
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <h3 class="font-bold text-emerald-800 mb-4">منحنى المخالفات (آخر 6 أشهر)</h3>
      <div style="height:300px"><canvas id="chartTrend"></canvas></div>
    </div>
  `;

  // Data prep
  const byGrade={}; GRADES.forEach(g=>byGrade[g]=0);
  const byCat={};
  const monthly={};
  
  for(let i=5; i>=0; i--){
    const d = new Date(); d.setMonth(d.getMonth()-i);
    const key = d.toLocaleDateString('ar-OM', {month:'short'});
    monthly[key] = 0;
  }

  DB.records.forEach(r=>{
    const s=DB.students.find(x=>x.id===r.studentId);
    if(s) byGrade[s.grade]=(byGrade[s.grade]||0)+1;
    
    const b=DB.behaviors.find(x=>x.id===r.behaviorId);
    const c=b?b.cat:'أخرى';
    byCat[c]=(byCat[c]||0)+1;

    const d = new Date(r.createdAt);
    const key = d.toLocaleDateString('ar-OM', {month:'short'});
    if(monthly[key] !== undefined) monthly[key]++;
  });

  // Draw
  if(charts.grade) charts.grade.destroy();
  charts.grade = new Chart(document.getElementById('chartGrade'), {
    type:'bar',
    data:{labels:GRADES.map(g=>'صف '+g),datasets:[{label:'عدد المخالفات',data:GRADES.map(g=>byGrade[g]||0),backgroundColor:'#059669',borderRadius:8}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
  });

  if(charts.cat) charts.cat.destroy();
  charts.cat = new Chart(document.getElementById('chartCat'), {
    type:'doughnut',
    data:{labels:Object.keys(byCat).length?Object.keys(byCat):['لا توجد'],datasets:[{data:Object.keys(byCat).length?Object.values(byCat):[1],backgroundColor:['#059669','#3B82F6','#F59E0B','#EF4444','#8B5CF6']}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}
  });

  if(charts.trend) charts.trend.destroy();
  charts.trend = new Chart(document.getElementById('chartTrend'), {
    type:'line',
    data:{labels:Object.keys(monthly),datasets:[{label:'المخالفات',data:Object.values(monthly),borderColor:'#3B82F6',backgroundColor:'rgba(59,130,246,0.1)',fill:true,tension:0.4}]},
    options:{responsive:true,maintainAspectRatio:false}
  });
}

function loadHealthData(){
  const sid = document.getElementById('healthStudent').value;
  const form = document.getElementById('healthForm');
  if(!sid){ form.classList.add('hidden'); return; }
  form.classList.remove('hidden');
  const s = DB.students.find(x => x.id === sid);
  const h = s.health || {};
  document.getElementById('hBlood').value = h.bloodType || '';
  document.getElementById('hAllergies').value = h.allergies || '';
  document.getElementById('hChronic').value = h.chronic || '';
  document.getElementById('hMeds').value = h.medications || '';
  document.getElementById('hEmName').value = h.emergencyName || '';
  document.getElementById('hEmPhone').value = h.emergencyPhone || '';
  document.getElementById('hNotes').value = h.notes || '';
}

function saveHealthData(){
  const sid = document.getElementById('healthStudent').value;
  const s = DB.students.find(x => x.id === sid);
  s.health = {
    bloodType: document.getElementById('hBlood').value.trim(),
    allergies: document.getElementById('hAllergies').value.trim(),
    chronic: document.getElementById('hChronic').value.trim(),
    medications: document.getElementById('hMeds').value.trim(),

      <div class="text-2xl font-black mt-1">${s.name}</div>
      <div class="text-sm opacity-90 mt-1">صف ${s.grade} / شعبة ${s.section}</div>
    </div>
    ${atRiskInfo.length?`<div class="bg-red-50 border-2 border-red-300 rounded-2xl p-4 mb-6">
      <div class="font-black text-red-800 text-sm mb-2">🚨 تنبيه مهم — وصل ابنكم للخطوة الأخيرة في:</div>
      ${atRiskInfo.map(a=>`<div class="text-sm text-red-700 mb-1">• ${a.behavior.name} — تكرار ${a.count} مرة</div>`).join('')}
    </div>`:''}
    <h3 class="font-black text-lg mb-3">📋 سجل السلوكيات (${recs.length})</h3>
    <div class="space-y-3">
      ${recs.length?recs.map(r=>`
        <div class="bg-white rounded-xl p-4 shadow-sm border-r-4 border-emerald-600">
          <div class="flex justify-between items-start mb-2 flex-wrap gap-2">
            <div class="font-bold text-slate-800">${r.behaviorName}</div>
            <div class="text-xs text-slate-500">${new Date(r.createdAt).toLocaleDateString('ar-OM',{year:'numeric',month:'long',day:'numeric'})}</div>
          </div>
          <div class="text-sm text-emerald-700 font-bold">▸ ${r.actionName}</div>
          ${r.notes?`<div class="text-xs text-slate-600 mt-2 bg-slate-50 p-2 rounded">📝 ${r.notes}</div>`:''}
        </div>`).join(''):'<div class="bg-white p-8 rounded-xl shadow-md text-center text-slate-400">لا يوجد سجلات — نأمل أن يبقى ابنكم متفوقاً سلوكياً 🌟</div>'}
    </div>
  `;
}

/* ============================================================
   14) أدوات مساعدة (Modal, Toast, Print)
============================================================ */
function showModal(content){
  document.getElementById('modalRoot').innerHTML=`
    <div class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
      <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[92vh] overflow-auto p-6">${content}</div>
    </div>`;
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

let toastTimer=null;
function showToast(msg,type='success'){
  const old=document.getElementById('toastBox'); if(old) old.remove();
  const bg=type==='error'?'bg-red-600':'bg-emerald-700';
  const box=document.createElement('div');
  box.id='toastBox';
  box.className=`fixed top-4 left-1/2 -translate-x-1/2 ${bg} text-white font-bold px-6 py-3 rounded-xl shadow-2xl z-[110] text-sm`;
  box.textContent=msg; document.body.appendChild(box);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>box.remove(),3000);
}

function openPrintModal(recordId){
  const record=DB.records.find(x=>x.id===recordId); if(!record) return;
  const student=DB.students.find(x=>x.id===record.studentId)||{name:'—',grade:'—',section:'—'};
  const behavior=DB.behaviors.find(x=>x.id===record.behaviorId)||{name:record.behaviorName,cat:'—'};
  const esc=record.escalationPath||getEscalation(behavior);
  const stepIdx=(record.escalationStep||1)-1;
  const html=buildPrintSheet(record,student,behavior,esc,stepIdx);
  showModal(`
    <div class="flex justify-between items-center mb-4 no-print flex-wrap gap-2">
      <h3 class="text-xl font-black">معاينة التقرير</h3>
      <div class="flex gap-2">
        <button onclick="doPrint('${recordId}')" class="bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-sm">🖨️ طباعة</button>
        <button onclick="closeModal()" class="bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-lg text-sm">إغلاق</button>
      </div>
    </div>
    <div class="bg-white border rounded-lg overflow-auto" style="max-height:75vh">
      ${html.replace(/<\/?html[^>]*>|<\/?head[^>]*>|<style>[\s\S]*?<\/style>|<\/?body[^>]*>|<\/?meta[^>]*>|<!DOCTYPE[^>]*>/gi,'')}
    </div>`);
}

function buildPrintSheet(record,student,behavior,esc,stepIdx){
  const schoolName=DB.settings.schoolName||'مدرسة المسعى';
  const dateStr=new Date(record.createdAt).toLocaleDateString('ar-OM',{year:'numeric',month:'long',day:'numeric'});
  const pastCount=(record.escalationStep||1)-1;
  const escHTML=esc.map((aid,i)=>{
    const a=DB.actions.find(x=>x.id===aid) || {name:'—'};
    const isCur=i===stepIdx, isPast=i<stepIdx;
    const bg=isCur?'#059669':(isPast?'#D1FAE5':'#F1F5F9');
    const color=isCur?'white':(isPast?'#065F46':'#64748B');
    return `<div style="display:inline-block;padding:5px 10px;margin:3px;border-radius:6px;background:${bg};color:${color};font-size:11px;font-weight:${isCur?'bold':'normal'};border:1px solid ${isCur?'#047857':'#E2E8F0'}">${isPast?'✓':isCur?'▶':'○'} ${i+1}. ${a.name}</div>`;
  }).join('');
  return `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><style>
    @page{size:A4;margin:15mm}*{box-sizing:border-box}
    body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;color:#1E293B;margin:0;font-size:12px;line-height:1.5}
    .header{text-align:center;border-bottom:3px double #059669;padding-bottom:10px;margin-bottom:16px}
    .header h1{font-size:17px;margin:4px 0;color:#065F46}.header .sub{font-size:11px;color:#475569}
    .title{text-align:center;font-size:15px;font-weight:bold;margin:14px 0;background:#ECFDF5;padding:8px;border-radius:6px;border:1px solid #A7F3D0}
    .section{margin:12px 0}.section h3{font-size:12px;color:#065F46;margin:0 0 6px;padding-right:8px;border-right:4px solid #059669}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .field{padding:6px 10px;background:#F8FAFC;border-radius:5px;font-size:11px;border:1px solid #E2E8F0}
    .field strong{color:#475569}
    .escalation{padding:10px;background:#F8FAFC;border-radius:6px;border:1px solid #E2E8F0}
    .reason{padding:10px;background:#FEF3C7;border-right:4px solid #F59E0B;border-radius:6px;font-size:11px;margin-top:8px;line-height:1.7}
    .signature{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:40px;font-size:11px}
    .signature div{padding-top:25px;border-top:1px dashed #94A3B8;text-align:center}
    .footer{text-align:center;margin-top:25px;font-size:9px;color:#94A3B8;border-top:1px solid #E2E8F0;padding-top:8px}
  </style></head><body>
    <div class="header">
      <div class="sub">بسم الله الرحمن الرحيم</div><div class="sub">سلطنة عُمان — وزارة التربية والتعليم</div>
      <h1>${schoolName}</h1><div class="sub">تقرير إجراء سلوكي طلابي</div>
    </div>
    <div class="title">تقرير سلوك — ${record.behaviorName}</div>
    <div class="section"><h3>بيانات الطالب</h3><div class="grid">
      <div class="field"><strong>الاسم:</strong> ${student.name}</div>
      <div class="field"><strong>الصف / الشعبة:</strong> ${student.grade} / ${student.section}</div>
      <div class="field"><strong>التاريخ:</strong> ${dateStr}</div>
      <div class="field"><strong>رقم السجل:</strong> ${record.id}</div>
    </div></div>
    <div class="section"><h3>تفاصيل المخالفة</h3><div class="grid">
      <div class="field"><strong>السلوك:</strong> ${record.behaviorName}</div>
      <div class="field"><strong>التصنيف:</strong> ${behavior.cat}</div>
      <div class="field"><strong>التكرارات السابقة:</strong> ${pastCount}</div>
      <div class="field"><strong>هذا التكرار رقم:</strong> ${record.escalationStep} من ${record.escalationTotal}</div>
    </div></div>
    <div class="section"><h3>التسلسل التصاعدي للإجراءات (${record.escalationTotal} خطوات)</h3>
      <div class="escalation">${escHTML}</div>
      <div class="reason"><strong>الإجراء المتخذ:</strong> ${record.actionName}<br>
        <strong>السبب:</strong> تطبيقاً للتسلسل التصاعدي المعتمد لهذا السلوك، ووصولاً للخطوة <strong>${record.escalationStep}</strong> من <strong>${record.escalationTotal}</strong> بعد <strong>${pastCount}</strong> تكرار سابق.</div>
    </div>
    ${record.regulationText?`<div class="section"><h3>النص اللائحي</h3><div class="field">${record.regulationText}</div></div>`:''}
    <div class="section"><h3>ملاحظات ومتابعة</h3>
      <div class="field"><strong>من تتم مقابلته:</strong> ${record.metWith||'—'}</div>
      <div class="field" style="margin-top:6px"><strong>ملاحظات:</strong> ${record.notes||'—'}</div>
    </div>
    <div class="signature">
      <div>يراجع الأستاذ: ${record.teacher||'—'}</div>
      <div>مدير المدرسة / المساعد</div>
    </div>
    <div class="footer">تم إنشاء هذا التقرير آلياً من منصة السلوك الطلابي — مدرسة المسعى<br>${new Date().toLocaleString('ar-OM')}</div>
  </body></html>`;
}

function doPrint(recordId){
  const record=DB.records.find(x=>x.id===recordId); if(!record) return;
  const student=DB.students.find(x=>x.id===record.studentId)||{};
  const behavior=DB.behaviors.find(x=>x.id===record.behaviorId)||{};
  const esc=record.escalationPath||getEscalation(behavior);
  const stepIdx=(record.escalationStep||1)-1;
  const html=buildPrintSheet(record,student,behavior,esc,stepIdx);
  const iframe=document.createElement('iframe');
  iframe.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(iframe);
  iframe.contentDocument.write(html); iframe.contentDocument.close();
  setTimeout(()=>{iframe.contentWindow.focus();iframe.contentWindow.print();setTimeout(()=>iframe.remove(),1500);},400);
}

function printMonthlyReport(){
  const d = new Date();
  const month = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const recs = DB.records.filter(r => {
    const rd = new Date(r.createdAt);
    return `${rd.getFullYear()}-${String(rd.getMonth()+1).padStart(2,'0')}` === month;
  });
  if(!recs.length) return showToast('لا توجد سجلات لهذا الشهر', 'error');
  
  const schoolName=DB.settings.schoolName||'مدرسة المسعى';
  const monthName=d.toLocaleDateString('ar-OM',{month:'long',year:'numeric'});
  
  const html = `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><style>
    @page{size:A4;margin:12mm}*{box-sizing:border-box}
    body{font-family:'Cairo',Tahoma,sans-serif;color:#1E293B;margin:0;font-size:11px}
    .header{text-align:center;border-bottom:3px double #059669;padding-bottom:8px;margin-bottom:12px}
    .header h1{font-size:16px;margin:2px 0;color:#065F46}.header .sub{font-size:10px;color:#475569}
    .title{text-align:center;font-size:14px;font-weight:bold;margin:10px 0;padding:8px;background:#ECFDF5;border-radius:6px}
    table{width:100%;border-collapse:collapse;font-size:10px;margin-top:10px}
    th{background:#ECFDF5;padding:5px;border:1px solid #A7F3D0;text-align:right}
    td{padding:4px 5px;border:1px solid #E2E8F0}
    tbody tr:nth-child(even){background:#F8FAFC}
    .center{text-align:center}
  </style></head><body>
    <div class="header"><div class="sub">بسم الله الرحمن الرحيم — وزارة التربية والتعليم</div>
      <h1>${schoolName}</h1><div class="sub">التقرير الشهري للسلوك الطلابي</div></div>
    <div class="title">شهر: ${monthName}</div>
    <table><thead><tr><th>التاريخ</th><th>الطالب</th><th>الصف</th><th>السلوك</th><th>الإجراء</th><th class="center">الخطوة</th></tr></thead><tbody>
    ${recs.map(r=>{const s=DB.students.find(x=>x.id===r.studentId)||{};return `<tr><td>${new Date(r.createdAt).toLocaleDateString('ar-OM')}</td><td>${s.name||'—'}</td><td>${s.grade||'—'}/${s.section||'—'}</td><td>${r.behaviorName}</td><td>${r.actionName}</td><td class="center">${r.escalationStep||'—'}/${r.escalationTotal||'—'}</td></tr>`;}).join('')}
    </tbody></table>
    <div style="text-align:center;margin-top:20px;font-size:9px;color:#94A3B8">تم الإنشاء: ${new Date().toLocaleString('ar-OM')}</div>
  </body></html>`;
  
  const iframe=document.createElement('iframe');
  iframe.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(iframe);
  iframe.contentDocument.write(html); iframe.contentDocument.close();
  setTimeout(()=>{iframe.contentWindow.focus();iframe.contentWindow.print();setTimeout(()=>iframe.remove(),1500);},400);
}

function exportExcel(){
  if(!DB.records.length) return showToast('لا توجد سجلات','error');
  const data=DB.records.map(r=>{
    const s=DB.students.find(x=>x.id===r.studentId)||{};
    return {
      'التاريخ':new Date(r.createdAt).toLocaleDateString('ar-OM'),
      'الطالب':s.name||'','الصف':s.grade||'','الشعبة':s.section||'',
      'السلوك':r.behaviorName,'الإجراء':r.actionName,
      'الخطوة':r.escalationStep?`${r.escalationStep}/${r.escalationTotal}`:'',
      'ملاحظات':r.notes||''
    };
  });
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'السجلات');
  XLSX.writeFile(wb,`سجلات-المسعى-${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast('تم التصدير ✓');
}
